name: Governance

on:
  pull_request:
  push:
    branches:
      - main
      - codex/viralgraph-cleanroom
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository authority
        run: pnpm governance:check

      - name: Test governance behavior
        run: pnpm governance:test

      - name: Prove fresh-agent orientation
        run: pnpm agent:preflight

blockers:
  - The $0.67 rung was attempted on 2026-08-02, not left unattempted. Track F run
    143e6229-cd55-4e10-b98b-290916589ae6 settled 9 of 16 nodes, then stalled for forty minutes with
    2,000,000 of 4,550,000 reserved micros stranded. Readiness inside one dispatch wave arrived in
    separate parent-completion batches, but the old wave-only dedupe key accepted the first event
    and silently dropped the rest. Migration 20260802020000_p0_dispatch_epoch_and_stranded_sweeper
    adds a monotonic dispatch epoch and arm_stranded_dispatch recovery cycle; regression suite
    00023 proves staggered same-wave promotion. The sweeper recovered the run to succeeded with all
    4,550,000 micros captured and zero outstanding reservation, but the broken runner exited at
    STATUS unknown and the attempt did not close the full approval/export/receipt acceptance record.
    T2 therefore reruns the rung rather than narrating it as never attempted.
  - All six original execution-engine defects are now closed and proven live. The last one -
    nothing ever produced approved_output, so create_export could never succeed - closed with the
    $0.075 approval-and-export proof. One master plus one adaptation ran through real waves (the
    first live wave promotion), the adaptation was built from run-level brief context with a minted
    capability URL, POST /runs/:id/approvals promoted both artifacts in place (HTTP 200, idempotent
    replay), and POST /runs/:id/exports returned HTTP 201 with a byte-identical ZIP on re-export -
    the first successful export in the system's history. Captured exactly 700,000 micros, zero
    residual. Evidence in governance/evidence/WP-P0-001/approval-export-proof.md.
  - The TRUE root cause of every stranded settlement is found, fixed, and proven on the real path.
    Supabase loads pg_safeupdate on API connections only, and advance_run_readiness cleared its
    scratch table with a bare DELETE - so every Worker-side terminal advance failed with SQLSTATE
    21000 while every direct-SQL validation passed. This, not the five missing grants, is what
    stranded both the copy incident and the fal master; the run in the proof above completed the
    rest of its lifecycle fully autonomously after the one-line fix
    (20260731020000_p0_readiness_safeupdate_fix), the first multi-wave settlement ever to do so
    without manual SQL. Standing verification doctrine - anything the privileged Worker calls must
    be verified through the PostgREST path (REST /rpc, apikey, service_role); pgTAP as postgres,
    direct SQL, and function fingerprints all passed while production was broken.
  - The $0.0004 copy-only money-path proof passed on live staging. Quoted 450,000 micros, captured
    exactly 450,000, zero residual, three JSON artifacts, run terminal succeeded, read back through
    the real GET /v1/runs/:id/receipt a customer would call. Getting there found and fixed FIVE
    missing service_role grants on privileged RPCs - three from today's Track C/D work
    (DROP FUNCTION clears grants; the migrations re-issued the revoke but not the matching grant) and
    two pre-existing from Track A (reap_dead_dispatch, finalize_cancel_requested_runs - both likely
    unreachable by the actual cron since they were introduced, because their own evidence validated
    them by calling the RPC directly as postgres, which bypasses grants). A new pgTAP suite
    (00021_p0_privileged_rpc_grants) asserts service_role execute on the full known privileged RPC
    surface so this class of defect fails loudly instead of shipping silently. A copy attempt whose
    synchronous settlement fails after submission has no automatic retry path once it leaves
    'created' - folded into Track E's reconciler work rather than left open. Evidence in
    governance/evidence/WP-P0-001/copy-only-money-path-proof.md.
  - Five of the six original execution-engine defects are closed and each is proven on live staging.
    Signed artifact-access capabilities give the 10 image-to-image and image-to-video nodes a
    fetchable private-R2 input, proven by fal itself fetching one and returning a real edit.
    create_quote now derives dispatch waves from the pinned graph's edges and marks only wave 1
    ready, while start_run_barrier creates every attempt eagerly and the gate moved to dispatch.
    Adaptation and motion nodes receive the run's brief and brand context plus exactly one upstream
    image. The OpenRouter copy route has a terminal path, an artifact and a capture. And the NaN
    capture that 503-looped every later fal webhook is gone. Evidence in
    governance/evidence/WP-P0-001/signed-artifact-access.md and staging-sync-tracks-c-and-d.md.
  - A wave-1 deadlock was found by adversarial review before it could cost anything, and is fixed.
    app_private.advance_run_readiness was reachable from exactly one place - inside
    advance_fal_provider_attempt, behind a provider_key='fal' join - while wave 1 of the launch pack
    is all three copy nodes on OpenRouter. The whole DAG would have stalled at wave 1 after copy was
    paid for. The shared settlement tail now lives in app_private.settle_attempt_transition and both
    provider entry points call it. Two further fal-only gates were shaped like validation and would
    each have looked already-fixed - a unit in ('image','video_second') filter in the ingest context
    lookup, and the same restriction again in TypeScript.
  - Staging is synced for Tracks C and D and the transfer was proven byte-exact - all nine changed
    functions match md5(pg_get_functiondef) against a local Postgres 17 with the migration files
    applied - but the staging migration HISTORY table still diverges from the repo's filenames. It
    carries 18 auto-named rows from earlier MCP applies with no local counterpart, which is why
    supabase db push refuses. Reconciling it means rewriting a record of what actually happened, so
    it is left as an explicit operator decision rather than quietly repaired.
  - Provider route identity and queue polling were both wrong and only live probing found either.
    The pinned Kontext application fal-ai/flux-kontext/pro does not exist on fal (its result reads
    back 404 "Path /pro not found"), which would have failed all 9 adaptation nodes after the 3
    masters they depend on were paid for; and the driver constructed queue status/result URLs by
    appending to the full submit endpoint, which 405s for every route except flux-2-pro, so the
    reconciler could never observe a paid Kontext or Seedance artifact. Both are fixed and pinned by
    tests; see governance/evidence/WP-P0-001/signed-artifact-access.md section 4. The remaining
    lesson is that fal's queue returns 200 IN_QUEUE for any submit body and validates only at
    execution, so no submit-time success proves a route is callable.
  - The last known settlement-transition hole is closed. Forward migration
    20260811000000_p0_poll_reconciliation_run_exit makes a poll-provider run leave
    reconciliation_required only after every attempt is terminal, with the established
    succeeded/partial_succeeded/failed/canceled aggregation and a WHERE guard that leaves unresolved
    runs parked; pgTAP suite 00024 covers both sides. refund_run_capture intentionally remains an
    operator-SQL-only P0 recovery tool until the human refund-authorization policy is accepted; it
    has no product or unattended Worker caller by design. Confirmation-token verification already
    closed in Track A with server-minted HMAC and constant-time verification.
  - The web product does not exist yet. apps/web makes zero HTTP requests to the Worker; all seven
    screens run on in-memory fixtures; there is no sign-in surface; and packages/contracts declares
    no response schemas, so no typed client can be built until that contract is closed.
  - P0 exit is gated on people rather than code. It needs 5-8 paid evaluator sessions (all eight
    slots still PENDING) and one signed paid pilot. Recruitment runs in parallel; sessions must not
    be held against fixtures.
  - The P1a charging model must enforce the fully-landed margin guardrail (at most $1.82 per pack
    for 60% margin), not the looser $5 gate.

  - product-contract
  - release-scope
  - system-overview
  - execution-providers-billing
  - data-auth-tenancy
  - adr-0002-platform-boundaries
  - roadmap
  - quality-gates
  - rls-hyperdrive-benchmark-plan
  - codex-finish-mega-prompt
required_skills:
  - cloudflare
  - wrangler
  - workers-best-practices
  - observability-ops
  - test-mastery
depends_on:
  - WP-P2-001

    - rls-hyperdrive-benchmark-plan
    - codex-finish-mega-prompt
deliverables:
  - Recorded evidence gates with measured triggers, benchmarks, rollback plans, and accepted
    decisions before each optional P3 infrastructure addition.
  - Queues, separate executor, direct high-volume adapters, circuit breakers, canaries, DR
    automation, compliance controls, and BYOK only when the recorded gate passes.
  - Postgres remains authoritative for permissions, revisions, runs, and money on every new path.
public_interfaces:
  - Existing REST/MCP/CLI/browser transports remain thin over the shared command layer. P3 scale
    services are internal execution infrastructure, not a second policy or billing authority.
steps:
  - id: p3-001-evidence-gate-evaluation
    title:
      Record measured triggers, benchmarks, rollback plans, and accepted decisions before adding
      queues, a separate executor, direct high-volume adapters, Hyperdrive user-path enablement, or
      BYOK.
    status: completed
  - id: p3-002-scale-infrastructure
    title: Implement only the P3 infrastructure additions explicitly authorized by a passed evidence
      gate in the prior step.
    status: completed
  - id: p3-003-phase-exit-handoff
    title: Prove P3 implementable acceptance and hand off; do not start P4 agency work without DTC
      retention evidence.
    status: completed
acceptance:
  automated:
    - id: postgres-remains-authority
      criterion:
        Tests prove any P3 scale path cannot mutate ledger, membership, or canvas head except
        through the existing revision/command barriers.
      status: passed
      evidence:
        - governance/evidence/WP-P3-001/queues/postgres-remains-authority-2026-08-31.md
        - governance/evidence/WP-P3-001/queues/live-wake-path-2026-09-01.md
    - id: evidence-gated-additions
      criterion:
        Each shipped P3 infrastructure addition has a recorded trigger, benchmark, rollback plan,
        and accepted decision before implementation.
      status: passed
      evidence:
        - governance/evidence/WP-P3-001/p3-evidence-gate-evaluation-2026-08-31.md
        - governance/evidence/WP-P3-001/p3-infrastructure-gates-pending.yaml
        - governance/evidence/WP-P3-001/backpressure/backpressure-fan-out-evidence.yaml
        - governance/evidence/WP-P3-001/backpressure/observability-2026-08-31.md
        - governance/evidence/WP-P3-001/benchmarks/hyperdrive-g1-g6-deferred-2026-09-01.md
        - governance/evidence/WP-P3-001/benchmarks/hyperdrive-fixture-seed-procedure-2026-09-01.md
  manual:
    - id: no-agency-expansion
      criterion: This packet did not add agency portals, white-labeling, multi-client reporting, or
        connected social publishing.
      status: passed
      evidence:
        - governance/evidence/WP-P3-001/no-agency-expansion.yaml
        - governance/evidence/WP-P3-001/p3-infrastructure-gates-pending.yaml
        - governance/evidence/WP-P3-001/p3-implementable-acceptance-2026-09-01.md
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-001/frontend-audit-2026-08-31.md
      - governance/evidence/WP-P3-001/p3-implementable-acceptance-2026-09-01.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-001/p3-evidence-gate-evaluation-2026-08-31.md
  - id: repository-verification
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-P3-001/frontend-audit-2026-08-31.md
      - governance/evidence/WP-P3-001/p3-implementable-acceptance-2026-09-01.md
rollback:
  strategy:
    Instant kill-switch set QUEUES_ENABLED=false on mustbeviral-v2-staging-core and redeploy,
    or wrangler rollback e2614072-adfa-404f-9ba9-32376a221130 --env staging. Live version
    e66b6d1c-47d1-44b9-b83d-e062c0119cae. Unbind OUTBOX_DISPATCH_QUEUE from the staging env and Git
    revert if needed. Delete only mustbeviral-v2-staging-outbox-dispatch when a later authorized
    destructive action names that exact queue. Do not destroy production or other queues.
  remote_actions_required: false
external_effects:
  remote_mutation: authorized
  destructive_remote_actions: false
handoff:
  current_step: p3-003-phase-exit-handoff
  next_action: Commit the P3-001 tree, then run corepack pnpm agent:finish --successor
    governance/evidence/WP-P3-001/successor-WP-P3-002.yaml. Do not start P4 agency work.

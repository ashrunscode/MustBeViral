rollback:
  strategy: Revert bounded baseline repairs and local prototype additions while preserving evidence
    and immutable history. No production or provider mutations occur. New foundation migrations are
    designed additively and applied only in their successor.
  remote_actions_required: false
external_effects:
  remote_mutation: read-only
  destructive_remote_actions: false

deliverables:
  - Feature inventory links existing routes, shared commands, contracts, database tables and test
    evidence, separating specification from local, connected and production proof.
  - Reproduce navigation context loss, campaign sentinel, closed billing model and styling failures
    in a controlled browser; record exact triggers and regression acceptance. Reproduce inherited
    database verification failures and repair underlying test/contract defects within the existing
    implementation.
  - Create named desktop/mobile HTML frames using approved Lightfield tokens and actual approved
    brand materials where available; walkthrough covers studio, persistent brand draft, findings,
    assets, campaign, review and recovery. Record missing visual approval explicitly; no unapproved
    production UI is shipped.
  - Use current official documentation to evaluate Postiz then Sendible then direct publishing, and
    source-first composition/reference input/render execution. Record capability, isolation, rights,
    retention, costs, ambiguity, quota and schedule ownership with unknowns explicit. No paid calls
    or external writes.
  - Prepare a ready W1 foundation packet with additive studio/grant/brand/location ownership,
    resource-aware routes and billing read contracts, negative tests and rollback. Record
    design/provider decisions as prerequisites of dependent work; do not mark unknown access or
    visual approval passed.
public_interfaces:
  - No public runtime behavior is newly advertised. Existing interfaces may receive bounded baseline
    repairs with tests; new product domains begin in the foundation successor. Prototype fixtures
    are explicitly local and synthetic where not actual owner-approved assets.
steps:
  - id: w0-002-baseline-and-recovery
    title: Inventory existing capability/evidence and reproduce baseline UI and database failures with
      bounded repairs.
    status: completed
  - id: w0-004-studio-brand-prototypes
    title: Produce and inspect desktop/mobile studio-to-brand-to-review frames and record the visual
      review state.
    status: completed
  - id: w0-005-integration-render-feasibility
    title: Record bounded publishing and source-first rendering feasibility, selected local approach and
      external dependencies.
    status: completed
  - id: w0-006-foundation-handoff
    title: Verify baseline evidence and ready W1 foundation successor without claiming missing
      human/provider acceptance.
    status: completed
acceptance:
  automated:
    - id: baseline-traceability
      criterion: Every baseline capability and reported failure has concrete code/test/browser evidence
        and a truthful evidence classification.
      status: passed
      evidence:
        - governance/evidence/WP-PLATFORM-W0-001/baseline-2026-09-09.md
    - id: database-baseline
      criterion: Run local migration/pgTAP verification; repair reproducible inherited failures and
        document exact unavailable dependencies without replacing connected proof with fixtures.
      status: passed
      evidence:
        - governance/evidence/WP-PLATFORM-W0-001/database-recovery-2026-09-10.md
        - governance/evidence/WP-PLATFORM-W0-001/database-baseline-2026-09-10.json
    - id: reviewable-prototypes
      criterion: Named HTML frames and desktop/mobile captures support the complete walkthrough with
        loading, empty, error, recovery and cross-brand context; no approval is inferred.
      status: passed
      evidence:
        - governance/evidence/WP-PLATFORM-W0-001/design-review-2026-09-09.md
    - id: feasibility-and-foundation
      criterion: Dated provider/render capability evidence and a ready W1 packet identify the selected
        local approach, missing access and the exact prerequisites for dependent implementation.
      status: passed
      evidence:
        - governance/evidence/WP-PLATFORM-W0-001/publishing-render-feasibility-2026-09-09.md
        - governance/evidence/WP-PLATFORM-W0-001/successor-WP-PLATFORM-W1-001.yaml
  manual: []
quality_gates:
  - id: design
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-PLATFORM-W0-001/database-recovery-2026-09-10.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:

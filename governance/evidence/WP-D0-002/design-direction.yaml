        The final 1440px canvas capture proves a full-visibility 12-node layout without clipped cards
        or inspector overlap.
    - dimension: legibility
      status: pass
      note:
        Campaign, quote, comparison, receipt, and canvas evidence preserve clear hierarchy, labels,
        amounts, statuses, and review actions at their named viewports.
    - dimension: responsive

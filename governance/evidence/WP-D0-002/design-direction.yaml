  - watch_item: 1440px inspector overflow
    resolution:
      Overflow was eliminated through a deterministic 1440px desktop layout that honors the 320px
      inspector aside.
  - watch_item: 12-node density proof
    resolution:
      The final desktop canvas keeps all 12 nodes fully visible, with the maximum card edge at
      1064px.
  - watch_item: quiet retry styling
    resolution: The free-retry affordance is a quiet underlined action that names the retained verified work.

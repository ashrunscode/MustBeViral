schema_version: 1
id: WP-PLATFORM-W2-001
spec_revision: 1
title: Bounded website and document sourcing with reviewable knowledge drafts
phase: P4
status: complete
priority: critical
branch: codex/viralgraph-cleanroom
objective: Implement W2.1 sourcing plus provenance-backed unapproved brand knowledge drafts so an
  operator can capture a website or document for WashBodega and UnPile, inspect where each finding
  came from, and correct a reviewable draft without treating extraction as approved knowledge.
  Preserve W1 studio, brand, invitation and billing contracts. No outreach, provider runs, charging
  or Stripe mutation.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - api-mcp-cli
  - execution-providers-billing

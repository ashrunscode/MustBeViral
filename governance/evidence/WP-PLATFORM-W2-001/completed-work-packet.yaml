    command: pnpm supabase:test
    status: passed
    evidence:
      - governance/evidence/WP-PLATFORM-W2-001/completion-and-review-2026-09-14.md
      - governance/evidence/WP-PLATFORM-W2-001/completion-2026-09-14/verification-receipt.json
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-PLATFORM-W2-001/completion-and-review-2026-09-14.md
      - governance/evidence/WP-PLATFORM-W2-001/completion-2026-09-14/verification-receipt.json
  - id: design
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-PLATFORM-W2-001/completion-and-review-2026-09-14.md
      - governance/evidence/WP-PLATFORM-W2-001/completion-2026-09-14/verification-receipt.json
  - id: repository
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-PLATFORM-W2-001/completion-and-review-2026-09-14.md
      - governance/evidence/WP-PLATFORM-W2-001/completion-2026-09-14/verification-receipt.json
rollback:
  strategy: Revert application changes while retaining additive source and knowledge-draft tables.
    Confirm W1 studio, brand, invitation, mapping and billing commands still work. Do not delete
    tenant data, weaken RLS, auto-approve knowledge or enable checkout to simulate recovery.
  remote_actions_required: false
external_effects:
  remote_mutation: read-only
  destructive_remote_actions: false

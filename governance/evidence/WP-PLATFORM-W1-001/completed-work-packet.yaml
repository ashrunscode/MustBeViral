rollback:
  strategy: Preserve old workspace/ledger tables and all durable IDs. Revert application handlers to
    the prior version while retaining additive tables and ownership mapping. Test that old commands
    continue working. Do not drop tenant data or reverse a backfill by guessing ownership;
    corrective local migrations must use the recorded mapping. No remote migrations are authorized.
  remote_actions_required: false
external_effects:
  remote_mutation: read-only
  destructive_remote_actions: false

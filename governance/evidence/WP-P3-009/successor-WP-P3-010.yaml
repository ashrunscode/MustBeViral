schema_version: 1
id: WP-P3-010
spec_revision: 2
title: Full-platform authority rebaseline
phase: P3
status: ready
priority: critical
branch: codex/viralgraph-cleanroom
objective: Adopt the owner-approved September 9 full-platform plan across the existing accepted
  authorities, preserving all 65 work units, cleanroom infrastructure, truthful evidence states, and
  separate production release obligations. Prepare the Wave 0 baseline and feasibility successor
  before product implementation.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - quality-gates
  - local-env-secrets
  - deploy-rollback-incidents
  - legacy-v1-retirement
  - adr-0005-document-governance
  - adr-0008-packet-supersession
required_skills:
  - build-mustbeviral
  - quality-check
depends_on:
  - WP-P3-009
scope:
  allowed_paths:
    - AGENTS.md
    - .agents/**
    - docs/**
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
    - docs/generated/**
    - docs/STATUS.md
    - docs/INDEX.md
    - governance/**
    - governance/config/**
    - governance/tests/**
    - governance/evidence/WP-P3-009/**
    - governance/evidence/WP-P3-010/**
    - PROJECT_STATE.yaml
    - llms.txt
    - package.json
    - governance/evidence/WP-PLATFORM-W0-001/**
  forbidden_paths:
    - apps/**
    - packages/**
    - supabase/**
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - data-auth-tenancy
    - quality-gates
    - deploy-rollback-incidents
    - adr-0005-document-governance
    - adr-0008-packet-supersession
deliverables:
  - Accept ADR-0007 as the owner-directed full-platform product reset and supersede the DTC-only
    decision and outdated finish-sprint contract without claiming their human validation passed.
  - Reconcile the product, release, UX, architecture, terminology, agent contract, build skill,
    roadmap and quality authorities. The roadmap owns all 65 supplied work units; do not add a
    competing ship plan or execution document database.
  - Preserve tenant isolation, immutable revisions and ledger, private media, existing deployment
    containment, required reviews, and CI cost controls. Replace only product-scope gates that
    contradict the accepted direction with tests of the new boundaries.
  - Record implemented, local, connected staging and production evidence distinctly; retain the
    unfinished observation and owner traffic ruling as release requirements.
  - Prepare a ready Wave 0 baseline/design/feasibility successor with exact scope, checks and
    external-effect boundaries.
public_interfaces:
  - Governance and documentation only. No product runtime, database, provider, account, deployment,
    DNS, traffic or financial mutation. Existing public API behavior stays unchanged.
steps:
  - id: p3j-001-full-platform-authorities
    title: Accept ADR-0007 and reconcile all accepted authorities with the September 9 full-platform plan.
    status: pending
  - id: p3j-002-scope-and-release-gates
    title: Update scope-sensitive governance tests while preserving runtime release containment and
      evidence requirements.
    status: pending
  - id: p3j-003-roadmap-and-successor
    title: Map all 65 work units into the existing roadmap and prepare the bounded Wave 0 successor.
    status: pending
  - id: p3j-004-rebaseline-verification
    title: Verify the authority-only rebaseline, committed evidence and ready successor.
    status: pending
acceptance:
  automated:
    - id: coherent-authority
      criterion:
        Manifest and generated documentation are valid with one accepted authority per topic, and
        no active contract contradicts the full-platform scope.
      status: pending
      evidence: []
    - id: complete-roadmap
      criterion:
        All supplied W0.1 through W12.5 work units and acceptance journeys are represented in the
        existing delivery authorities.
      status: pending
      evidence: []
    - id: preserved-boundaries
      criterion:
        Governance tests preserve historical receipts, private production containment, permission
        and spend boundaries, and truthful pending release obligations.
      status: pending
      evidence: []
    - id: ready-successor
      criterion: The Wave 0 successor names baseline reproduction, prototypes and feasibility
        deliverables, tests, rollback and external authorizations.
      status: pending
      evidence: []
  manual: []
quality_gates:
  - id: governance
    command: pnpm governance:check
    status: pending
    evidence: []
  - id: governance-tests
    command: pnpm governance:test
    status: pending
    evidence: []
  - id: repository-verification
    command: pnpm verify
    status: pending
    evidence: []
rollback:
  strategy:
    Revert the rebaseline commit without rewriting receipt history. Keep supersession evidence
    and all unfinished production release obligations. No remote changes occur.
  remote_actions_required: false
external_effects:
  remote_mutation: none
  destructive_remote_actions: false
handoff:
  current_step: p3j-001-full-platform-authorities
  next_action: Accept ADR-0007 and reconcile all accepted authorities with the September 9 full-platform plan.
  blockers: []
  changed_paths: []
  last_green_checks: []
completion:
  successor_packet_id: null
  evidence_paths: []
  completed_at: null

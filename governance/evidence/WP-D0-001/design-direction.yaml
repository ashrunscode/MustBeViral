review:
  findings:
    - dimension: accessibility
      status: noted
      note:
        All branches pair status color with icon and text and hold dark-token contrast; focus-visible
        rings and reduced-motion behavior are not verifiable from static captures and carry into
        high-fidelity review as required checks.
    - dimension: density
      status: pass
      note: Calm-Density delivers the ledger-style activity table and docked quote strip; the other
        branches keep compact control sizing without crowding.
    - dimension: legibility
      status: pass
      note:
        Canvas Legibility renders the largest node typography with directional lineage; all branches
        keep Geist Mono for identifiers, prices, and model labels.
    - dimension: responsive
      status: noted
      note: Desktop captures only at this gate by design; tablet drawer and mobile review flows are
        extended from the chosen branch per the experience contract.
approval:
  state: pending

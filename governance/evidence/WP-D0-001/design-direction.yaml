review:
  findings:
    - dimension: accessibility
      status: noted
      note:
        Ink-alpha body text on paper meets the contrast bar in all renders; status always icon+text;
        the Review Approval QA copy even models a 4.5:1 contrast finding. Focus-visible and
        reduced-motion remain high-fidelity verification items (static captures cannot prove them).
    - dimension: density
      status: pass
      note:
        Calm Density carries a six-row immutable ledger and compact node meta without breaking the
        paper calm; no branch crowds below the 4px grid.
    - dimension: legibility
      status: pass
      note:
        Canvas Legibility renders 17px node titles with Lightfield monocaps metadata, recessed rail
        drawers, and a clearly directional animated flow edge.
    - dimension: responsive
      status: noted
      note:
        Desktop captures at this gate by design; tablet drawers and mobile review extend from the
        ratified branch. The Review Approval right panel clips slightly at 1440 and carries an
        overflow-discipline note into high fidelity.

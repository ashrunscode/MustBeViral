schema_version: 1
manifest_id: mustbeviral-authority-v1
project_id: mustbeviral-studio
rules:
  one_authority_per_topic: true
  register_every_document: true
  markdown_frontmatter_keys:
    - doc_id
  unresolved_marker_patterns:
    - 'T[O]DO'
    - 'T[B]D'
    - 'F[I]XME'
  forbid_supersession_cycles: true
  require_generator_for_generated: true
  forbid_nested_agent_contracts: true
  forbidden_paths:
    - docs/archive
  forbidden_name_patterns:
    - '^FINAL_'
    - '^FIX_LOG'
    - '^PROMPT_ROADMAP'
    - '^MASTER_EXECUTION_PACKAGE'

documents:
  - id: manifest
    path: docs/MANIFEST.yaml
    kind: registry
    status: accepted
    owner: product-architecture
    authority_topics: [documentation.registry]
    review_triggers: [document_added, document_removed, document_status_changed, authority_changed]
    supersedes: []

  - id: docs-index
    path: docs/INDEX.md
    kind: navigation
    status: accepted
    owner: product-architecture
    authority_topics: [documentation.navigation]
    review_triggers: [manifest_changed]
    supersedes: []

  - id: project-status
    path: docs/STATUS.md
    kind: status_projection
    status: accepted
    owner: delivery
    authority_topics: [documentation.current_state_projection]
    review_triggers: [project_state_changed, active_packet_changed]
    supersedes: []

  - id: glossary
    path: docs/GLOSSARY.md
    kind: glossary
    status: accepted
    owner: product-architecture
    authority_topics: [product.terminology]
    review_triggers: [public_term_added, entity_added, state_machine_changed]
    supersedes: []

  - id: product-contract
    path: docs/product/PRODUCT_CONTRACT.md
    kind: product
    status: accepted
    owner: product
    authority_topics:
      [product.customer, product.job_to_be_done, product.launch_pack, product.success_hypothesis]
    review_triggers: [launch_customer_changed, launch_job_changed, p0_evidence_reviewed]
    supersedes: []

  - id: release-scope
    path: docs/product/RELEASE_SCOPE.md
    kind: product
    status: accepted
    owner: product
    authority_topics: [product.release_scope, product.non_goals, product.phase_boundaries]
    review_triggers: [phase_changed, evidence_gate_changed, scope_change_requested]
    supersedes: []

  - id: experience-contract
    path: docs/ux/EXPERIENCE_CONTRACT.md
    kind: ux
    status: accepted
    owner: design
    authority_topics:
      [
        ux.principles,
        ux.visual_direction,
        ux.accessibility,
        ux.responsive_behavior,
        ux.performance_targets,
      ]
    review_triggers:
      [design_approved, design_system_changed, accessibility_finding, performance_budget_changed]
    supersedes: []

  - id: canvas-screen-states
    path: docs/ux/CANVAS_AND_SCREEN_STATES.md
    kind: ux
    status: accepted
    owner: design
    authority_topics:
      [
        ux.information_architecture,
        ux.screen_states,
        ux.canvas_interactions,
        ux.semantic_canvas_parity,
      ]
    review_triggers: [screen_added, canvas_command_changed, run_state_changed]
    supersedes: []

  - id: system-overview
    path: docs/architecture/SYSTEM_OVERVIEW.md
    kind: architecture
    status: accepted
    owner: architecture
    authority_topics:
      [
        architecture.system_context,
        architecture.platform_ownership,
        architecture.monorepo_boundaries,
        architecture.data_flow,
      ]
    review_triggers:
      [platform_boundary_changed, application_added, package_added, deployment_topology_changed]
    supersedes: []

  - id: data-auth-tenancy
    path: docs/architecture/DATA_AUTH_AND_TENANCY.md
    kind: architecture
    status: accepted
    owner: security-data
    authority_topics:
      [
        architecture.data_ownership,
        architecture.tenancy,
        architecture.rls,
        architecture.graph_persistence,
        architecture.hyperdrive_gate,

schema_version: 1
id: WP-P1A-001
spec_revision: 1
title: Secure paid single-user web product
phase: P1a
status: in_progress
priority: critical
branch: codex/viralgraph-cleanroom
objective: Ship the paid single-user MustBeViral Studio product with production-grade identity and
  RLS, Stripe subscription and prepaid wallet, entitlements and spend caps, transactional email,
  telemetry, billing UI, operational reconciliation, and a production deploy/rollback path, without
  waiting on P0 partner-qualification evidence and without unauthorized production mutations.
authority_refs:
  - product-contract
  - release-scope
  - experience-contract
  - canvas-screen-states
  - system-overview
  - data-auth-tenancy
  - execution-providers-billing
  - api-mcp-cli
  - roadmap
  - quality-gates
  - local-env-secrets
  - deploy-rollback-incidents
  - legacy-v1-retirement
  - generated-model-catalog
  - codex-finish-mega-prompt
required_skills:
  - data-architect
  - auth-fortress
  - api-craft
  - cloudflare
  - wrangler
  - workers-best-practices
  - billing-engine
  - email-flow
  - observability-ops
  - test-mastery
  - superdesign
  - frontend-master
depends_on:
  - WP-P0-001
scope:
  allowed_paths:
    - apps/**
    - packages/**
    - supabase/**
    - .superdesign/**
    - governance/evidence/WP-P1A-001/**
    - governance/evidence/WP-P0-001/transition-receipt.yaml
    - governance/evidence/WP-P0-001/completed-work-packet.yaml
    - governance/tests/**
    - governance/schemas/**
    - governance/scripts/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - tsconfig.json
    - tsconfig.base.json
    - eslint.config.mjs
    - vitest.config.ts
    - playwright.config.ts
    - .env.example
    - .dev.vars.example
    - .prettierignore
    - .github/workflows/quality.yml
    - PROJECT_STATE.yaml
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
  forbidden_paths:
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - experience-contract
    - canvas-screen-states
    - system-overview
    - data-auth-tenancy
    - execution-providers-billing
    - api-mcp-cli
    - roadmap
    - quality-gates
    - local-env-secrets
    - deploy-rollback-incidents
    - generated-model-catalog
    - codex-finish-mega-prompt
deliverables:
  - Closed-enrollment production-grade identity and forced RLS for the single-owner workspace, with
    kill switches for signup, generation, provider routes, and charging.
  - Stripe test-mode subscription, setup charge, prepaid wallet, entitlements, and signed webhook
    ingestion at POST /webhooks/stripe on the shared command layer using integer USD micros.
  - Transactional Resend email and Sentry/OTel telemetry that never become business-state authority
    and never log secrets, signed URLs, or customer media.
  - Usage and billing UI states plus expanded private exports and operational reconciliation.
  - Production deploy/rollback evidence path and Web Vitals instrumentation; live production
    mutation only when exact resource IDs and rollback evidence are authorized.
public_interfaces:
  - P1a authenticated REST /v1 plus POST /webhooks/stripe, browser billing/usage surfaces, and
    existing launch-pack commands. No production OAuth, public MCP discovery, or CLI in this packet.
steps:
  - id: p1a-001-production-identity-and-rls
    title: Implement closed-enrollment production-grade identity, JWT/RLS tenancy, and kill switches for
      signup, generation, provider routes, and charging without enabling public signup.
    status: completed
  - id: p1a-002-stripe-wallet-entitlements
    title: Implement Stripe test-mode setup charge, subscription, prepaid wallet, entitlements, and
      signed webhook settlement on the integer-micros ledger with the $1.82 fully-landed margin
      guardrail.
    status: completed
  - id: p1a-003-transactional-email-and-telemetry
    title: Integrate Resend transactional/auth email and Sentry/OTel with redaction, correlation IDs,
      and fail-closed missing-credential behavior.
    status: completed
  - id: p1a-004-billing-usage-ui
    title: Ship Lightfield usage and billing screens and expanded private exports against approved
      tokens, with tests for funded, low-balance, blocked, receipt, and refund/release states.
    status: completed
  - id: p1a-005-production-deploy-rollback-and-vitals
    title: Complete the production deploy/rollback evidence path and Web Vitals measurement contract
      without promoting V2 or cutting legacy traffic unless exact IDs are authorized.
    status: completed
  - id: p1a-006-p1b-successor-handoff
    title: Prove P1a implementable acceptance and activate WP-P1B-001 from
      governance/evidence/WP-P0-001/successor-WP-P1B-001.yaml.
    status: current
acceptance:
  automated:
    - id: stripe-wallet-ledger-invariants
      criterion: Tests prove setup, subscription, wallet credit, reservation, capture, release, and refund
        stay balanced in integer USD micros, enforce entitlements and caps, and ignore duplicate
        Stripe webhook deliveries.
      status: passed
      evidence:
        - packages/billing/src/stripe-settlement.test.ts
        - packages/billing/src/stripe-webhook.test.ts
        - apps/core/test/unit/stripe-webhook-settlement.test.ts
        - apps/core/test/unit/stripe-webhook-dedup.test.ts
        - supabase/tests/database/00029_p1a_stripe_wallet_settlement.test.sql
        - governance/evidence/WP-P0-001/p1a-implementation-progress-2026-08-30.md
    - id: email-telemetry-fail-closed
      criterion: Missing Resend or Sentry configuration fails closed; successful paths never persist
        secrets, signed URLs, or customer media in logs or fixtures.
      status: passed
      evidence:
        - apps/core/test/unit/core-email.test.ts
        - packages/telemetry/src/adapters.test.ts
        - packages/email/src/index.test.ts
        - governance/evidence/WP-P0-001/p1a-email-telemetry-fail-closed-2026-08-30.md
    - id: billing-ui-states
      criterion: Component and flow tests cover funded, low-balance, blocked, receipt-detail, and
        refund/release billing states without a hidden mock charge.
      status: passed
      evidence:
        - apps/web/src/features/billing/billing-usage-panel.test.tsx
        - packages/billing/src/entitlements.test.ts
        - governance/evidence/WP-P0-001/p1a-implementation-progress-2026-08-30.md
  manual:
    - id: no-unauthorized-production-mutation
      criterion: No production, live Stripe, DNS, or credential dashboard mutation occurred unless
        PROJECT_STATE and this packet named the exact resource IDs and rollback evidence.
      status: passed
      evidence:
        - governance/evidence/WP-P0-001/p1a-production-deploy-rollback-stub-2026-08-30.md
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-P0-001/p1a-implementation-progress-2026-08-30.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-P0-001/p1a-implementation-progress-2026-08-30.md
  - id: repository-verification
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-P0-001/p1a-implementation-progress-2026-08-30.md
rollback:
  strategy: Revert the packet's implementation and generated/evidence changes through auditable Git
    history. Do not destroy remote resources. Disable new charging and signup with kill switches if
    a remote test-mode object was created under explicit authorization.
  remote_actions_required: false
external_effects:
  remote_mutation: approval-required
  destructive_remote_actions: false
handoff:
  current_step: p1a-006-p1b-successor-handoff
  next_action: Run corepack pnpm agent:finish --successor
    governance/evidence/WP-P0-001/successor-WP-P1B-001.yaml to activate WP-P1B-001.
  blockers: []
  changed_paths: []
  last_green_checks: []
completion:
  successor_packet_id: WP-P1B-001
  evidence_paths: []
  completed_at: null

schema_version: 1
id: WP-PLATFORM-W1-002
spec_revision: 1
title: Saved onboarding, resource-aware navigation and actual billing
phase: P4
status: ready
priority: critical
branch: codex/viralgraph-cleanroom
objective: Complete the W1.2 portfolio UI and W1.3-W1.5 so an operator can add and resume a durable
  brand draft, switch WashBodega and UnPile safely in the approved studio interface, recover old
  campaign links and see actual workspace billing without invented balances or implicit access.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - api-mcp-cli
  - execution-providers-billing
  - experience-contract
  - quality-gates
  - roadmap
  - local-env-secrets
  - adr-0007-full-platform
required_skills:
  - build-mustbeviral
  - data-architect
  - auth-fortress
  - api-and-interface-design
  - superdesign
  - frontend-master
  - billing-engine
  - quality-check
depends_on:
  - WP-PLATFORM-W1-001
scope:
  allowed_paths:
    - apps/web/**
    - apps/core/**
    - apps/cli/**
    - apps/mcp/**
    - packages/contracts/**
    - packages/domain/**
    - packages/db/**
    - packages/config/**
    - packages/ui/**
    - supabase/**
    - governance/**
    - docs/**
    - .superdesign/**
    - PROJECT_STATE.yaml
    - llms.txt
  forbidden_paths:
    - .github/workflows/**
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - data-auth-tenancy
    - api-mcp-cli
    - execution-providers-billing
    - experience-contract
    - quality-gates
    - roadmap
    - local-env-secrets
deliverables:
  - Implement the owner-approved September 9 WashBodega/UnPile desktop and mobile direction with
    durable studio, brand and location selection, portfolio search and permission-aware
    home/navigation, explicit empty, loading, revoked, archived and failure states, and accessible
    keyboard and screen-reader flows.
  - Persist a minimal brand onboarding draft immediately through shared commands. Website/manual
    entry, operator corrections, draft progress and chosen workspace/studio survive reload and
    reconnect. Do not claim website understanding or approved knowledge before W2 evidence exists.
  - Resolve old campaign/project links through authenticated project-to-brand mappings. Missing or
    ambiguous mappings show scoped recovery without sentinel IDs, name guessing, cross-tenant
    fallback or browser storage as authority. Navigation must retain only the active resource scope.
  - Add workspace and brand settings, team invitation/role presets and revocation behavior through
    typed grants. Persist invitation state without sending mail or granting access before the
    intended recipient accepts. No new implicit execution, media, billing or publishing authority.
  - Read actual workspace ledger balances, usage and billing/subscription state. Loading,
    unavailable, missing subscription and permission denial remain distinct. Preserve integer money
    and existing charging/checkout kill switches; no customer charge, Stripe mutation or provider
    run is authorized.
  - Prepare WP-PLATFORM-W2-001 for bounded website/document sourcing, extraction provenance and
    reviewable brand knowledge drafts, preserving W1 resource and permission contracts.
public_interfaces:
  - Extend authoritative Zod operations and generate REST, typed client, MCP and CLI projections.
    Preserve the existing W1 identity operations and legacy supported routes.
  - Additive onboarding/invitation persistence with explicit ownership and backfill mapping,
    generated database types, and application rollback to the prior schema-compatible version.
steps:
  - id: w1b-001-durable-drafts-and-settings
    title:
      Implement persistent onboarding, resource resolution and invitation/settings contracts with
      tenant-safe database behavior.
    status: pending
  - id: w1b-002-approved-studio-navigation
    title: Implement the approved studio and brand surfaces with saved draft progress and compatible
      authenticated old links.
    status: pending
  - id: w1b-003-actual-billing
    title:
      Connect actual workspace billing reads and distinct error/permission states without enabling
      charging.
    status: pending
  - id: w1b-004-journeys-and-successor
    title:
      Verify desktop/mobile two-brand onboarding, navigation and billing journeys and prepare the
      bounded W2 sourcing successor.
    status: pending
acceptance:
  automated:
    - id: saved-two-brand-onboarding
      criterion:
        WashBodega and UnPile synthetic drafts persist separately through reload, reconnect,
        concurrent edits and interrupted saves; no browser-storage substitute or fabricated
        analysis.
      status: pending
      evidence: []
    - id: tenant-resource-navigation
      criterion:
        Desktop/mobile navigation, brand switches, direct/old links, back/forward and archived or
        missing resources resolve only permitted identities. Revoked grants, forged child IDs and
        stale responses cannot display another brand or re-enable a forbidden action.
      status: pending
      evidence: []
    - id: invitations-and-permissions
      criterion:
        Invitation creation/replay, expiry, exact recipient acceptance, revoked membership, stale
        role changes and unauthorized grant escalation are tested in handlers and pgTAP. Local
        delivery uses explicit synthetic fixtures and sends no outreach.
      status: pending
      evidence: []
    - id: truthful-billing-and-accessibility
      criterion: Billing reads match actual seeded integer ledger balances and subscription records;
        missing, unavailable and denied states are distinct. Desktop/mobile behavior, keyboard,
        accessibility and approved visual direction pass without enabling spending or charging.
      status: pending
      evidence: []
  manual: []
quality_gates:
  - id: database
    command: pnpm supabase:test
    status: pending
    evidence: []
  - id: governance
    command: pnpm governance:check
    status: pending
    evidence: []
  - id: design
    command: pnpm design:check
    status: pending
    evidence: []
  - id: repository
    command: pnpm verify
    status: pending
    evidence: []
rollback:
  strategy: Revert application changes while retaining additive drafts, invitations and durable
    mappings. Confirm old workspace, project, execution and ledger commands still work. Do not
    delete tenant data, weaken RLS, discard old routes or enable checkout to simulate recovery.
  remote_actions_required: false
external_effects:
  remote_mutation: read-only
  destructive_remote_actions: false
handoff:
  current_step: w1b-001-durable-drafts-and-settings
  next_action:
    After W1 foundation completion, run preflight and implement durable onboarding drafts,
    invitation/settings contracts and authenticated resource resolution using the accepted identity
    and grant model.
  blockers: []
  changed_paths: []
  last_green_checks: []
completion:
  successor_packet_id: WP-PLATFORM-W2-001
  evidence_paths: []
  completed_at: null

schema_version: 1
id: WP-P3-008
spec_revision: 1
title: Disabled-behavior production environment binding
phase: P3
status: blocked
priority: critical
branch: codex/viralgraph-cleanroom
objective: Bind the exact isolated V2 production resources, deploy Core and web with all customer,
  provider, charging, and signup behavior disabled, verify private smoke paths, and keep legacy
  traffic and DNS unchanged.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - quality-gates
  - local-env-secrets
  - deploy-rollback-incidents
  - legacy-v1-retirement
  - codex-finish-mega-prompt
required_skills:
  - cloudflare
  - wrangler
  - workers-best-practices
  - supabase
  - auth-fortress
  - observability-ops
  - quality-check
depends_on:
  - WP-P3-007
scope:
  allowed_paths:
    - apps/core/**
    - apps/web/**
    - packages/config/**
    - packages/contracts/**
    - packages/db/**
    - supabase/**
    - governance/evidence/WP-P3-008/**
    - governance/evidence/WP-P3-007/**
    - governance/tests/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - tsconfig.json
    - tsconfig.base.json
    - eslint.config.mjs
    - vitest.config.ts
    - PROJECT_STATE.yaml
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
    - docs/STATUS.md
    - docs/generated/TRACEABILITY.md
  forbidden_paths:
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - data-auth-tenancy
    - quality-gates
    - local-env-secrets
    - deploy-rollback-incidents
    - legacy-v1-retirement
    - codex-finish-mega-prompt
deliverables:
  - Production configuration names only Supabase `jjgtlfblsfobdhmtngbz`, R2
    `mustbeviral-v2-production-media`, Core `mustbeviral-v2-production-core`, and Vercel project ID
    `prj_oPGn8bYorRz0VvXhsWUnHhGN0vGj`; no legacy or placeholder target is accepted.
  - Production secrets are transferred provider-to-provider without values entering source, docs,
    logs, or messages; secret presence and environment separation are verified.
  - Core and web deploy with signup, generation, provider routes, queues, and customer charging off;
    no custom domain or DNS route changes.
  - Authenticated smoke proves health, closed enrollment, private artifact denial, database/RLS
    connectivity, and rollback identifiers without creating customer or provider work.
  - Security/performance Advisor findings are rechecked; justified foreign-key and RLS-plan repairs
    are forward-only and complete before traffic.
public_interfaces:
  - Provider-generated preview/worker URLs may be used for private smoke only. `mustbeviral.com`,
    `api.mustbeviral.com`, legacy V1 traffic, public signup, charging, and generation remain
    unchanged.
steps:
  - id: p3h-001-config-and-secret-preflight
    title: Validate exact resource identities, disabled flags, secrets, Advisor disposition, and rollback.
    status: completed
  - id: p3h-002-unrouted-core-deploy
    title: Deploy production Core without a custom route and prove all costly behavior disabled.
    status: completed
  - id: p3h-003-isolated-web-deploy
    title: Deploy the exact Vercel project without attaching MustBeViral production domains.
    status: completed
  - id: p3h-004-private-smoke-and-cutover-gate
    title: Run private smoke checks and prepare a separate DNS/customer-traffic decision packet.
    status: current
acceptance:
  automated:
    - id: exact-disabled-production
      criterion: Provider reads and HTTP smoke prove exact bindings, healthy deployments, closed
        enrollment, private media, and all spend/traffic feature gates disabled.
      status: pending
      evidence:
        - governance/evidence/WP-P3-008/production-binding-and-smoke-2026-09-02.md
    - id: no-legacy-or-dns-mutation
      criterion: Before/after inventory proves no legacy resource, custom domain, DNS record, route,
        customer row, provider run, or charge changed.
      status: passed
      evidence:
        - governance/evidence/WP-P3-008/before-after-inventory-2026-09-02.md
  manual:
    - id: private-production-containment
      criterion:
        The deployments are usable only for operator smoke through provider URLs and are not
        represented as a public launch or customer-ready release.
      status: passed
      evidence:
        - governance/evidence/WP-P3-008/production-binding-and-smoke-2026-09-02.md
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-008/production-binding-and-smoke-2026-09-02.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-008/production-binding-and-smoke-2026-09-02.md
  - id: repository-verification
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-P3-008/production-binding-and-smoke-2026-09-02.md
rollback:
  strategy: Keep DNS and legacy traffic unchanged. Roll web back to its prior Vercel deployment or
    remove the new alias; deploy the prior Core version/config; leave additive database migrations
    intact and fix forward. Disable every behavior gate before investigating.
  remote_actions_required: true
external_effects:
  remote_mutation: authorized
  destructive_remote_actions: false
handoff:
  current_step: p3h-004-private-smoke-and-cutover-gate
  next_action:
    Obtain fresh explicit authorization for exactly one production owner identity, then run
    the authenticated zero-spend RLS/database smoke without enabling signup.
  blockers:
    - 'BLOCKED_NO_APPROVED_PRODUCTION_OPERATOR_IDENTITY: Supabase auth.users is zero; no approved
      production identity exists, and this packet forbids inventing one or enabling public signup.'
  changed_paths:
    - PROJECT_STATE.yaml
    - apps/core/.dev.vars.example
    - apps/core/package.json
    - apps/core/src/composition/kill-switches.ts
    - apps/core/src/bindings.ts
    - apps/core/src/routes/v1.ts
    - apps/core/test/unit/fal-ingest.test.ts
    - apps/core/test/unit/kill-switches.test.ts
    - apps/core/test/unit/quote-composition.test.ts
    - apps/core/test/unit/v1-routes.test.ts
    - apps/core/worker-configuration.d.ts
    - apps/core/wrangler.jsonc
    - apps/web/src/lib/platform/kill-switches.test.ts
    - apps/web/src/lib/platform/kill-switches.ts
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
    - governance/evidence/WP-P3-008/before-after-inventory-2026-09-02.md
    - governance/evidence/WP-P3-008/production-binding-and-smoke-2026-09-02.md
    - governance/evidence/WP-P3-008/rollback-and-handoff-2026-09-02.md
    - governance/evidence/WP-P3-008/successor-WP-P3-009.yaml
    - governance/tests/production-release-config-gate.test.mjs
    - llms.txt
    - supabase/migrations/20260902154759_production_disabled_binding_hardening.sql
    - supabase/tests/database/00036_production_disabled_binding_hardening.test.sql
  last_green_checks:
    - pnpm exec vitest run --config vitest.config.ts test/unit/v1-routes.test.ts
      test/unit/kill-switches.test.ts test/unit/fal-ingest.test.ts
    - pnpm exec wrangler deploy --env production --config apps/core/wrangler.jsonc
    - pnpm design:check
    - pnpm governance:check
    - pnpm verify
completion:
  successor_packet_id: null
  evidence_paths: []
  completed_at: null

schema_version: 1
id: WP-P3-001
spec_revision: 1
title: Scale, direct adapters, resilience, and compliance
phase: P3
status: in_progress
priority: medium
branch: codex/viralgraph-cleanroom
objective: Add evidence-triggered scale infrastructure—queues, a separately deployable executor,
  direct high-volume provider adapters, circuit breakers, canaries, disaster-recovery automation,
  stronger compliance controls, and BYOK—only when measured triggers, benchmarks, rollback plans,
  and accepted decisions justify each addition.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - execution-providers-billing
  - data-auth-tenancy
  - adr-0002-platform-boundaries
  - roadmap
  - quality-gates
  - rls-hyperdrive-benchmark-plan
  - codex-finish-mega-prompt
required_skills:
  - cloudflare
  - wrangler
  - workers-best-practices
  - observability-ops
  - test-mastery
depends_on:
  - WP-P2-001
scope:
  allowed_paths:
    - apps/**
    - packages/**
    - supabase/**
    - governance/evidence/WP-P3-001/**
    - governance/evidence/WP-P2-001/transition-receipt.yaml
    - governance/evidence/WP-P2-001/completed-work-packet.yaml
    - governance/tests/**
    - governance/schemas/**
    - governance/scripts/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - tsconfig.json
    - tsconfig.base.json
    - eslint.config.mjs
    - vitest.config.ts
    - playwright.config.ts
    - wrangler.jsonc
    - apps/core/wrangler.jsonc
    - PROJECT_STATE.yaml
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
  forbidden_paths:
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - execution-providers-billing
    - data-auth-tenancy
    - adr-0002-platform-boundaries
    - roadmap
    - quality-gates
    - rls-hyperdrive-benchmark-plan
    - codex-finish-mega-prompt
deliverables:
  - Recorded evidence gates with measured triggers, benchmarks, rollback plans, and accepted
    decisions before each optional P3 infrastructure addition.
  - Queues, separate executor, direct high-volume adapters, circuit breakers, canaries, DR
    automation, compliance controls, and BYOK only when the recorded gate passes.
  - Postgres remains authoritative for permissions, revisions, runs, and money on every new path.
public_interfaces:
  - Existing REST/MCP/CLI/browser transports remain thin over the shared command layer. P3 scale
    services are internal execution infrastructure, not a second policy or billing authority.
steps:
  - id: p3-001-evidence-gate-evaluation
    title:
      Record measured triggers, benchmarks, rollback plans, and accepted decisions before adding
      queues, a separate executor, direct high-volume adapters, Hyperdrive user-path enablement, or
      BYOK.
    status: completed
  - id: p3-002-scale-infrastructure
    title: Implement only the P3 infrastructure additions explicitly authorized by a passed evidence
      gate in the prior step.
    status: current
  - id: p3-003-phase-exit-handoff
    title: Prove P3 implementable acceptance and hand off; do not start P4 agency work without DTC
      retention evidence.
    status: pending
acceptance:
  automated:
    - id: postgres-remains-authority
      criterion:
        Tests prove any P3 scale path cannot mutate ledger, membership, or canvas head except
        through the existing revision/command barriers.
      status: pending
      evidence: []
    - id: evidence-gated-additions
      criterion:
        Each shipped P3 infrastructure addition has a recorded trigger, benchmark, rollback plan,
        and accepted decision before implementation.
      status: passed
      evidence:
        - governance/evidence/WP-P3-001/p3-evidence-gate-evaluation-2026-08-31.md
        - governance/evidence/WP-P3-001/p3-infrastructure-gates-pending.yaml
  manual:
    - id: no-agency-expansion
      criterion: This packet did not add agency portals, white-labeling, multi-client reporting, or
        connected social publishing.
      status: passed
      evidence:
        - governance/evidence/WP-P3-001/p3-infrastructure-gates-pending.yaml
        - governance/evidence/WP-P2-001/no-queue-or-agency-expansion.yaml
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-001/frontend-audit-2026-08-31.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-001/p3-evidence-gate-evaluation-2026-08-31.md
  - id: repository-verification
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-P3-001/frontend-audit-2026-08-31.md
rollback:
  strategy: Revert P3 infrastructure changes through Git. Disable newly introduced queues, executor
    routes, or direct adapters with kill switches rather than destroying namespaces unless exact IDs
    and rollback evidence are authorized.
  remote_actions_required: false
external_effects:
  remote_mutation: approval-required
  destructive_remote_actions: false
handoff:
  current_step: p3-002-scale-infrastructure
  next_action: >-
    Run staging evidence harnesses per staging-evidence-collection-runbook.md, fill evidence YAML
    from templates, and obtain operator acceptance for at least one gate before implementing queues,
    executor, Hyperdrive user-path, or BYOK.
  blockers: []
  changed_paths:
    - governance/evidence/WP-P3-001/staging-evidence-collection-runbook.md
    - governance/evidence/WP-P3-001/operator-checklist.yaml
    - governance/evidence/WP-P3-001/templates/backpressure-fan-out-evidence.template.yaml
    - governance/evidence/WP-P3-001/templates/hyperdrive-g1-g6-evidence.template.yaml
    - governance/evidence/WP-P3-001/templates/separate-executor-isolation-evidence.template.yaml
    - governance/evidence/WP-P3-001/backpressure/README.md
    - governance/evidence/WP-P3-001/benchmarks/README.md
    - governance/evidence/WP-P3-001/separate-executor/README.md
    - governance/evidence/WP-P3-001/p3-infrastructure-gates-pending.yaml
    - governance/evidence/WP-P3-001/p3-002-framework-handoff-2026-08-31.md
    - apps/core/tools/p3-scale-evidence-lib.ts
    - apps/core/tools/p3-backpressure-harness.ts
    - apps/core/tools/p3-hyperdrive-benchmark-harness.ts
    - apps/core/tools/p3-executor-isolation-harness.ts
    - apps/core/test/unit/p3-scale-evidence-harness.test.ts
    - apps/core/package.json
    - PROJECT_STATE.yaml
    - docs/STATUS.md
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
  last_green_checks:
    - corepack pnpm design:check
    - corepack pnpm agent:verify
    - corepack pnpm test (apps/core — 311 passed incl. p3-scale-evidence-harness)
completion:
  successor_packet_id: null
  evidence_paths:
    - governance/evidence/WP-P3-001/frontend-audit-2026-08-31.md
    - governance/evidence/WP-P3-001/p3-evidence-gate-evaluation-2026-08-31.md
    - governance/evidence/WP-P3-001/p3-infrastructure-gates-pending.yaml
    - governance/evidence/WP-P3-001/staging-evidence-collection-runbook.md
    - governance/evidence/WP-P3-001/p3-002-framework-handoff-2026-08-31.md
    - governance/evidence/WP-P3-001/operator-checklist.yaml
  completed_at: null

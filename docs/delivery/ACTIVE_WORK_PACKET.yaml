schema_version: 1
id: WP-PLATFORM-W3-002
spec_revision: 2
title: Asset originals and rights, first operator-first pilot packet
phase: P4
status: in_progress
priority: high
branch: main
objective: Deliver roadmap row 5 (W3.1) as the first packet of the owner's operator-first pilot on
  V2 (2026-10-07). Each brand gets reusable private originals for photos, logos, documents and
  video, with verified hash, MIME, size and dimensions, recovery from an interrupted upload, rights
  and recognizable-person release records with expiry and revocation, and denial across clients. No
  Drive connection, publishing, generation, queue or charge is enabled. A new Assets surface ships
  only after its named desktop and mobile frames are approved under the visual approval gate.
authority_refs:

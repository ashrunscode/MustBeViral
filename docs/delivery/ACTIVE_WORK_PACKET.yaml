schema_version: 1
id: WP-PLATFORM-W3-001
spec_revision: 1
title: Render feasibility and measured runtime decision
phase: P4
status: ready
priority: critical
branch: main
objective: Prove the conditional sharp 0.34.5 and fal-first rendering direction in ADR-0010 before
  implementing customer rendering. Benchmark exact source imagery, logos, text, typography and
  real-footage video, private transfer, bounded resource use, cancellation and cost. Record a
  measured architecture decision. A local benchmark alone does not establish Vercel or fal connected
  acceptance. Preserve W1 and W2 behavior; do not claim Wave 2 or Wave 3 exited.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - api-mcp-cli
  - execution-providers-billing
  - experience-contract
  - quality-gates
  - roadmap
  - local-env-secrets
  - adr-0007-full-platform
  - adr-0010-drive-autopilot-saas
required_skills:
  - build-mustbeviral
  - api-webhook-contracts
  - git-release-quality
depends_on:
  - WP-PLATFORM-W2-003
scope:
  allowed_paths:
    - packages/artifacts/**
    - packages/providers/**
    - packages/contracts/**
    - packages/config/**
    - apps/web/**
    - apps/core/**
    - governance/**
    - docs/**
    - PROJECT_STATE.yaml
    - llms.txt
  forbidden_paths:
    - .github/workflows/**
    - docs/archive/**
    - legacy-exports/**
    - supabase/migrations/**
  required_doc_ids:
    - product-contract
    - system-overview
    - execution-providers-billing
    - quality-gates
    - roadmap
    - local-env-secrets
    - adr-0010-drive-autopilot-saas
deliverables:
  - Before benchmark implementation, inspect the merged base and existing artifacts/provider
    drivers. Declare exact fixture references and rights, runtime versions, project/region/plan,
    documented memory/duration/input/output limits, repetition count and cost ceiling in the
    existing evidence directory. Use current official documentation. Resolve build-skill
    architecture specialist guidance before an irreversible architecture decision. Do not install
    another executor or create infrastructure.
  - Build a bounded local benchmark under packages/artifacts using the already pinned sharp 0.34.5.
    Test one actual premises/product photograph, exact logo, approved font and literal price/offer
    text at 1080x1350 and 1080x1080, with orientation metadata. Use private local inputs with
    explicit rights; repository evidence contains hashes and measurements, not customer media or
    signed URLs. Synthetic fixtures prove mechanics only, never real-asset fidelity.
  - Prepare a project-scoped stateless Vercel Node benchmark and fal composition request for a 15-30
    second 1080x1920 real-footage reel with captions, graphics, audio rights and checked cover.
    Reuse the existing project and provider drivers. Core owns permissions, durable jobs, money and
    private R2 registration. Demonstrate short-lived capability validation, wrong-tenant,
    expired/replayed capability denial, output verification and cancellation behavior.
  - Predeclare at least 20 static repetitions including cold and warm samples, report p50/p95, peak
    memory, output bytes, failures and integer USD micros. Pass only within the declared documented
    runtime ceilings with resource headroom and a bounded per-job cost. Video timing is separate.
    Record actual provider receipts and failed attempts; do not infer cost from a schema or count an
    API login as a render. Enforce the owner's cumulative $100 development ceiling after deducting
    all previous reserved/actual usage. No ads, public posts or charging.
  - Commit the measured architecture decision before dependent production rendering. A failed or
    unavailable hosted benchmark remains a named blocker with a concrete correction/approval
    request. Preserve source/output hashes, exact commit and environment, fidelity comparison,
    privacy/cancellation proof and independent review. Prepare WP-PLATFORM-W3-002 for asset
    originals/rights without implementing it here. Full product checks remain required.
public_interfaces:
  - No customer-visible route, subscription change or live renderer is enabled in this packet.
    Benchmark-only interfaces remain private and use typed immutable composition inputs and
    Core-authorized capabilities. Thin transport code must not acquire scheduling, billing or
    permission authority. No new database, media library, queue or durable job authority.
steps:
  - id: w3f-001-preflight
    title: Inventory source rights, exact runtime limits, budget and hosted benchmark permissions.
    status: pending
  - id: w3f-002-local-static
    title: Measure deterministic source-faithful static composition and failure boundaries locally.
    status: pending
  - id: w3f-003-connected-render
    title: Prove the approved Vercel and fal paths with real media, privacy and cost receipts.
    status: pending
  - id: w3f-004-decision
    title: Independently review the measured decision and prepare the asset originals successor.
    status: pending
acceptance:
  automated:
    - id: benchmark-integrity
      criterion:
        Exact inputs, immutable composition, original/output hashes, deterministic static results
        and resource measurements are reproducible; invalid capabilities and oversized inputs fail
        closed.
      status: pending
      evidence: []
    - id: connected-runtime
      criterion: Existing Vercel Node and fal composition paths demonstrate real-media static/reel
        fidelity, captions/fonts/overlays, private transfer, cancellation, documented bounds and
        actual costs within the remaining cumulative budget.
      status: pending
      evidence: []
    - id: regression-and-decision
      criterion:
        Existing product regressions pass and independent review covers the measured architecture
        decision; failed or unavailable requirements remain unaccepted and dependent rendering
        remains disabled.
      status: pending
      evidence: []
  manual:
    - id: source-fidelity
      criterion: An authorized operator compares actual source and outputs, confirms recognizable
        premises/product, exact logo/text/font, readable reel captions and a correct cover, with
        rights provenance recorded.
      status: pending
      evidence: []
quality_gates:
  - id: governance
    command: pnpm governance:check
    status: pending
    evidence: []
  - id: design
    command: pnpm design:check
    status: pending
    evidence: []
  - id: repository
    command: pnpm verify
    status: pending
    evidence: []
  - id: database-regression
    command: pnpm supabase:test
    status: pending
    evidence: []
rollback:
  strategy: Retain benchmark evidence and source hashes; keep customer rendering disabled. Revert
    benchmark application code through a reviewed PR if necessary. Preserve existing
    artifact/provider contracts and all rollback material. No infrastructure, data or provider
    output deletion is authorized by this packet.
  remote_actions_required: false
external_effects:
  remote_mutation: approval-required
  destructive_remote_actions: false
handoff:
  current_step: w3f-001-preflight
  next_action: Inventory the existing artifact/provider paths, approved real-media references and
    runtime limits; prepare any exact hosted benchmark permission still required before remote
    effects.
  blockers: []
  changed_paths: []
  last_green_checks: []
completion:
  successor_packet_id: WP-PLATFORM-W3-002
  evidence_paths: []
  completed_at: null

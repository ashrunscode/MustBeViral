schema_version: 1
id: WP-D0-002
spec_revision: 1
title: Review Approval high-fidelity D0 exit closure
phase: D0
status: in_progress
priority: critical
branch: codex/viralgraph-cleanroom
objective: Extend the operator-ratified Review Approval direction to high fidelity across campaign
  brief, canvas, quote/run, output comparison, receipt, and responsive review flows; amend the
  accepted experience contract to the Lightfield identity; and close the remaining D0 exit evidence
  for enabled-model price, license, retention, moderation, and capability coverage including
  economy-tier candidates such as kimi-class text and Seedance/fal video, platform-algorithm
  research playbooks, golden briefs and qualified-user recruitment, and the RLS/Hyperdrive benchmark
  plan.
authority_refs:
  - product-contract
  - release-scope
  - experience-contract
  - canvas-screen-states
  - data-auth-tenancy
  - execution-providers-billing
  - roadmap
  - quality-gates
  - source-register
  - generated-model-catalog
required_skills:
  - superdesign
  - frontend-master
depends_on:
  - WP-D0-001
scope:
  allowed_paths:
    - .superdesign/**
    - governance/evidence/WP-D0-002/**
    - governance/evidence/WP-D0-001/transition-receipt.yaml
    - governance/evidence/WP-D0-001/completed-work-packet.yaml
    - governance/schemas/design-direction-evidence.schema.json
    - governance/scripts/validate-design-direction.mjs
    - governance/tests/**
    - docs/ux/**
    - docs/research/**
    - docs/MANIFEST.yaml
    - docs/INDEX.md
    - docs/STATUS.md
    - docs/generated/**
    - package.json
    - PROJECT_STATE.yaml
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
    - llms.txt
  forbidden_paths:
    - apps/**
    - packages/**
    - supabase/**
    - docs/archive/**
    - pnpm-lock.yaml
  required_doc_ids:
    - product-contract
    - release-scope
    - experience-contract
    - canvas-screen-states
    - data-auth-tenancy
    - execution-providers-billing
    - roadmap
    - quality-gates
    - source-register
    - generated-model-catalog
deliverables:
  - Accepted experience-contract amendment replacing the exploration-only dark-studio direction with
    the operator-directed Lightfield identity and its accessible responsive rules
  - Review Approval high-fidelity campaign brief, canvas, quote/run, output comparison, receipt,
    tablet review, and mobile review renders with named captures
  - Approved-golden evidence extending the design-direction contract with full-flow and responsive
    artifact references, captures, review findings, and explicit operator approval
  - Current source-backed price, license, retention, moderation, capability, and evaluation evidence
    for every enabled launch model and evaluated economy-tier candidates
  - Source-backed platform-algorithm creative playbooks for the launch-pack destinations
  - A 20-brief representative golden corpus and a definition and recruitment record for five to
    eight qualified DTC/e-commerce evaluators
  - Data API/RPC baseline and Hyperdrive candidate benchmark plan covering cold and warm
    p50/p95/p99, concurrency, conflicts, errors, and pooled-identity isolation
  - Transition-ready WP-P0-001 successor draft and complete WP-D0-002 handoff evidence
public_interfaces: []
steps:
  - id: d1-000-experience-contract-lightfield
    title: Amend and register the experience contract with the operator-directed Lightfield identity
    status: completed
  - id: d1-001-high-fidelity-flow-renders
    title:
      Render the full Review Approval desktop, tablet, and mobile flow set while correcting 1440px
      inspector overflow, proving full 12-node density, quieting retry styling, and specifying
      focus-visible and reduced-motion behavior
    status: completed
  - id: d1-002-approved-golden-evidence
    title: Capture the named full-flow golden set and extend validated design-direction evidence
    status: completed
  - id: d1-003-model-catalog-evidence
    title: Register current source-backed price, license, retention, moderation, capability, and
      evaluation evidence for every enabled model and evaluated economy-tier candidate
    status: completed
  - id: d1-004-platform-algorithm-playbooks
    title: Author source-backed platform-algorithm creative playbooks for launch-pack destinations
    status: completed
  - id: d1-005-golden-briefs-and-recruitment
    title: Define the 20 representative golden briefs and recruit or qualify five to eight evaluators
    status: completed
  - id: d1-006-rls-hyperdrive-benchmark-plan
    title: Specify the Data API/RPC baseline and Hyperdrive candidate benchmark plan with latency,
      concurrency, conflict, error, and pooled-identity cases
    status: completed
  - id: d1-007-successor-handoff
    title: Validate D0 exit evidence and prepare the WP-P0-001 successor transition
    status: current
acceptance:
  automated:
    - id: high-fidelity-design-direction-evidence
      criterion:
        The design-direction validator proves rendered campaign brief, canvas, quote/run, output
        comparison, receipt, tablet review, and mobile review artifacts with named captures,
        recorded watch-item resolutions, and explicit approval state.
      status: pending
      evidence: []
    - id: lightfield-contract-and-docs
      criterion: The accepted experience-contract amendment defines the Lightfield identity, remains
        registered in the documentation manifest, regenerates affected references, and passes pnpm
        docs:check.
      status: pending
      evidence: []
    - id: enabled-model-catalog-evidence
      criterion:
        Generated model-catalog evidence is complete and current for price, license, retention,
        moderation, capability, and evaluation fields for every enabled model, with no enabled model
        surviving missing or stale evidence.
      status: pending
      evidence: []
    - id: remaining-d0-exit-evidence
      criterion:
        Registered evidence proves the platform-algorithm playbooks, 20 representative golden
        briefs, five-to-eight-user qualification and recruitment definition, and a Data API/RPC
        versus Hyperdrive benchmark plan covering cold and warm p50/p95/p99, concurrency, conflicts,
        errors, and pooled-identity isolation.
      status: pending
      evidence: []
  manual:
    - id: high-fidelity-golden-approval
      criterion:
        The operator explicitly approves the named high-fidelity desktop, tablet, and mobile
        golden set after reviewing the rendered flow artifacts; silence or agent preference cannot
        count as approval.
      status: pending
      evidence: []
    - id: amended-experience-contract-approval
      criterion:
        The operator explicitly approves the amended Lightfield experience contract before D0 is
        closed or production UI implementation begins.
      status: pending
      evidence: []
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: pending
    evidence: []
  - id: governance
    command: pnpm governance:check
    status: pending
    evidence: []
  - id: repository-verification
    command: pnpm verify
    status: pending
    evidence: []
rollback:
  strategy:
    Revert the packet's SuperDesign artifacts, approved-golden evidence, validator extensions,
    experience-contract amendment, research and model-catalog evidence, generated references, and
    root scripts; the production application, shared packages, database, and Supabase paths remain
    unchanged.
  remote_actions_required: false
external_effects:
  remote_mutation: authorized
  destructive_remote_actions: false
handoff:
  current_step: d1-007-successor-handoff
  next_action: Amend and register the experience contract with the operator-directed Lightfield identity
  blockers: []
  changed_paths: []
  last_green_checks:
    - pnpm agent:preflight
    - pnpm governance:check
    - pnpm verify
completion:
  successor_packet_id: WP-P0-001
  evidence_paths: []
  completed_at: null

deliverables:
  - Fail-closed environment-provisioning evidence for isolated staging Supabase, Vercel, Core
    Worker, and private R2 targets plus sanitized fal and Moonshot credential and webhook inputs;
    evidence records only target identifiers, readiness, provenance, and operator-owned missing
    inputs, never secret values.
  - Forward-only Supabase migrations, generated types, tenant-safe repositories, forced RLS and
    hardened RPC contracts for workspaces, briefs, brand kits, projects, immutable canvas revisions,
    runs, attempts, providers, private artifacts and lineage, quotes, reservations, integer-micros
    ledger entries, idempotency records, audit events, and transactional outbox events.
  - Shared typed domain, graph, command/query, billing, artifact, and API contracts implementing
    legal state machines, typed DAG validation, canonical hashing, expected-revision conflicts,
    affected-descendant invalidation, immutable 15-minute quotes, transactional spend caps, and
    balanced append-only semantic-ledger behavior without automated customer charging.
  - 'Real provider integration for the evidence-cleared launch routes: Moonshot text planning and
    copy plus the curated fal launch trio for FLUX.2 [pro] masters, FLUX Kontext [pro] adaptations,
    and Seedance 1.0 Pro Fast motion (Lite retired on fal; historical route key retained); every
    route is versioned, price-pinned, retention/license-cleared, fail-closed when evidence or
    credentials are absent, and exercised through outbox dispatch, signed webhook verification,
    reconciliation, and idempotent handling.'
  - Verified server-side copy of accepted provider output into private R2, private-by-default
    metadata and access, artifact verification and quarantine, deterministic exports, and immutable
    provider/model/cost/lineage receipts with no fal delivery URL exposed as a product artifact.
  - Production UI matching the approved Review Approval Lightfield goldens for campaign brief,
    canvas, quote/confirm, run progress, output comparison, review/approval, export, and receipt,
    including work-motion and reduced-motion behavior, full component and screen states, semantic
    outline parity, responsive review, WCAG 2.2 AA behavior, and measured performance budgets.
  - Real end-to-end evidence across all 20 representative golden briefs, five-to-eight qualified
    evaluator sessions, transactional cost caps, technical/latency/quality/economic metrics, and
    sanitized durable evidence that one qualified DTC customer or design partner will use staging
    and either intends to pay or has agreed commercial terms.
  - Private Core Worker MCP evidence for exactly get_canvas_context, apply_canvas_patch, quote_run,
    start_run, and get_run through MCP Inspector and two real clients using the same handlers,
    contracts, authorization, validation, idempotency, confirmation, and safe errors as REST.
  - P0 gate decision evidence, operator go/no-go, pivot/stop record on any required-gate failure,
    and transition-ready WP-P1A-001 successor handoff.
public_interfaces:
  - P0 authenticated REST /v1 surface for workspace, project, canvas, patch, validation, quote,
    explicitly confirmed run, run status/cancel, private artifact upload/access, export, model
    explanation, receipt, and signed fal webhook operations defined by api-mcp-cli.
  - 'Private P0 MCP operations only: get_canvas_context, apply_canvas_patch, quote_run, start_run,
    and get_run; no public discovery, production OAuth, broader tools, or CLI surface in P0.'
steps:
  - id: p0-000-environment-provisioning
    title: Record fail-closed environment-provisioning evidence for isolated Supabase, Vercel, Core
      Worker, and private R2 targets and for operator-supplied fal and Moonshot credentials, webhook
      material, price evidence, and retention/DPA clearance without storing or printing secrets in
      the repository.
    status: completed
  - id: p0-001-database-rls-migrations
    title: Implement the authoritative Postgres schema, forward-only migrations, generated types,
      hardened RPCs, forced RLS, least-privilege roles, cross-tenant isolation, migration sequence,
      rollback/idempotency, pooled-identity, and ledger-invariant tests; retain Data API/RPC unless
      the accepted Hyperdrive benchmark proves every G1-G6 enablement condition.
    status: completed
  - id: p0-002-domain-command-layer
    title: Implement shared domain, graph, command/query, quote, reservation, artifact, and
      integer-micros ledger contracts with deterministic legal state machines, canonical graph
      hashes, immutable revisions, affected-descendant calculation, transparent quotes, explicit
      confirmation, idempotency, auditability, and unit and contract tests.
    status: completed
  - id: p0-003-real-provider-adapters
    title:
      Integrate the evidence-cleared Moonshot text route and curated fal image/video launch trio
      through versioned drivers, a transactional outbox, immediate post-commit dispatch, signed
      webhook verification, safe ambiguous-submit reconciliation, duplicate-proof idempotency,
      private R2 verification/copy, catalog and kill-switch enforcement, and boundary integration
      tests with no hidden mock or silent fallback.
    status: completed
  - id: p0-004-golden-locked-ui
    title: Implement the campaign brief, 100-node canvas and semantic outline, work-motion, graph
      validation and conflict recovery, named-price quote/confirm, partial run progress, output
      comparison, review/approval, export, and receipt flows against the approved Review Approval
      goldens with complete component/screen states, responsive behavior, accessibility, reduced
      motion, and visual and performance tests.
    status: completed
  - id: p0-005-golden-launch-pack-runs
    title: Execute real end-to-end launch-pack runs for the 20 golden briefs, producing the required
      three master statics, nine approved adaptations, three copy sets, one 6-10 second 9:16 motion
      branch, QA, private review/export artifacts, and immutable receipts while transactionally
      enforcing per-run, workspace-day, and global-day caps and measuring first-reviewable latency.
    status: completed
  - id: p0-006-private-mcp-proof
    title:
      Prove the exact five private MCP operations in MCP Inspector and two real clients against the
      shared REST handlers and contract vectors for success, validation, authorization, conflict,
      expiry, explicit confirmation, idempotent replay, rate limit, provider ambiguity, and safe
      error semantics.
    status: completed
  - id: p0-007-p0-gate-evaluation
    title:
      Evaluate all P0 technical, usability, output-quality, latency, privacy, trust, performance,
      economic, and paid-demand gates across the 20 briefs and five-to-eight qualified evaluator
      sessions; record an operator go/no-go and a pivot/stop decision whenever a required value,
      cost, or paid-demand gate fails.
    status: current
  - id: p0-008-p1a-successor-handoff
    title:
      Assemble complete immutable P0 evidence and prepare the WP-P1A-001 successor transition only
      when every required gate passes, with one exact next action and no unresolved blocker or
      decision.
    status: pending
acceptance:
  automated:
    - id: representative-run-completion-and-latency
      criterion:
        Machine-readable evidence from the 20 registered golden briefs proves at least 16 of 20
        launch-pack runs technically complete with real enabled providers, while median time to the
        first reviewable static pack is at most 10 minutes and p90 is at most 15 minutes.
      status: passed
      evidence:
        - governance/evidence/WP-P0-001/golden-20-run-proof.md
        - governance/evidence/WP-P0-001/golden-20-defect-analysis.md
        - governance/evidence/WP-P0-001/launch-pack-runs/golden-20/summary.json
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: transactional-spend-dedup-and-ledger
      criterion: Concurrency, replay, webhook, polling, timeout, ambiguous-submit, retry, and
        reconciliation tests prove the default $8/run, $25/workspace/day, and $100/global/day caps
        are enforced in authoritative transactions and produce zero duplicate provider submissions,
        duplicate charges, duplicate money movement, negative/cap-breaching reservations, or
        unexplained ledger differences.
      status: passed
      evidence:
        - governance/evidence/WP-P0-001/golden-20-run-proof.md
        - governance/evidence/WP-P0-001/golden-20-defect-analysis.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: private-artifact-trust-and-lineage
      criterion:
        Automated storage, HTTP, export, and end-to-end assertions prove every generated artifact
        is verified and private by default, no public bucket or provider-delivery URL is exposed,
        every access URL is exact-key and short-lived, and no completed output contains a hidden
        mock, silent fallback, missing artifact lineage, or missing immutable provider/model/cost
        receipt.
      status: passed
      evidence:
        - governance/evidence/WP-P0-001/signed-artifact-access.md
        - governance/evidence/WP-P0-001/full-pack-proof.md
        - governance/evidence/WP-P0-001/golden-20-run-proof.md
        - governance/evidence/WP-P0-001/launch-pack-runs/golden-20/summary.json
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: canvas-and-web-performance
      criterion:
        Measured browser evidence proves ordinary pan and zoom maintains at least 55 FPS with 100
        visible nodes, the 500-node stress graph remains navigable through level-of-detail rendering
        and virtualization, and the agreed production segment meets p75 LCP at most 2.5 seconds, INP
        at most 200 milliseconds, and CLS at most 0.1.
      status: pending
      evidence:
        - governance/evidence/WP-P0-001/real-web-client-wiring.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: private-mcp-rest-semantic-parity
      criterion:
        Contract vectors pass for the exact five private MCP operations through MCP Inspector and
        two real clients, proving the same revision, validation, authorization, quote, confirmation,
        run, idempotency, recovery, and safe-error semantics as REST with no broader P0 MCP surface.
      status: passed
      evidence:
        - governance/evidence/WP-P0-001/mcp-parity-proof.md
        - governance/evidence/WP-P0-001/mcp-parity-vectors.json
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: usable-pack-landed-cost
      criterion:
        Reconciled immutable provider, storage, execution, and artifact evidence computes landed
        cost in integer USD micros and proves landed cost is at most $5 for every launch pack
        counted as usable, with no unexplained receipt or catalog-price difference.
      status: pending
      evidence:
        - governance/evidence/WP-P0-001/pricing-decision.md
        - governance/evidence/WP-P0-001/golden-20-run-proof.md
        - governance/evidence/WP-P0-001/launch-pack-runs/golden-20/summary.json
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
        - governance/evidence/WP-P0-001/landed-cost-honesty-inventory.md
  manual:
    - id: unassisted-workflow-completion
      criterion: Across the qualified-user evaluation sessions, at least 80% of users complete brief
        through quote, explicit confirmation, run, and review without assistance under the
        registered protocol.
      status: pending
      evidence:
        - governance/evidence/WP-P0-001/self-session-kit.md
        - governance/evidence/WP-P0-001/self-sessions/TEMPLATE.md
        - docs/research/EVALUATOR_RECRUITMENT.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: usable-concept-rate
      criterion:
        Qualified evaluators applying the registered rubric determine that at least 70% of the 20
        launch-pack jobs produce one or more usable concepts without relaxing supplied claim,
        rights, brand, or QA constraints.
      status: pending
      evidence:
        - docs/research/GOLDEN_BRIEFS.md
        - docs/research/EVALUATOR_RECRUITMENT.md
        - governance/evidence/WP-P0-001/self-session-kit.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: evaluator-workflow-preference
      criterion:
        At least three of five qualified evaluators explicitly prefer the launch-pack workflow to
        their current process in recorded evaluation evidence.
      status: pending
      evidence:
        - docs/research/EVALUATOR_RECRUITMENT.md
        - governance/evidence/WP-P0-001/operator-decisions-2026-08-11.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: qualified-paid-pilot-proof
      criterion:
        At least one qualified DTC customer or design partner has sanitized durable evidence that
        it will use staging and either intends to pay or has agreed commercial terms, without
        exposing customer data, payment secrets, customer media, tokens, or signed URLs. Actual
        payment and Stripe are not required in P0.
      status: pending
      evidence:
        - docs/research/EVALUATOR_RECRUITMENT.md
        - governance/evidence/WP-P0-001/operator-decisions-2026-08-11.md
        - governance/evidence/WP-P0-001/operator-decisions-2026-08-30.md
        - governance/evidence/WP-P0-001/design-partner-enablement-check-2026-08-30.md
        - governance/evidence/WP-P0-001/recruiting-inbox-check-2026-08-30-1400.md
        - governance/evidence/WP-P0-001/recruiting-inbox-check-2026-08-31-1400.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md
    - id: operator-p0-exit-decision
      criterion:
        The operator reviews the complete technical, usability, output-quality, latency, trust,
        privacy, performance, economic, and paid-demand evidence and records an explicit P0 exit
        go/no-go; silence cannot count as approval, and any failed usable-output, economics, or
        paid-demand gate records a pivot/stop decision and blocks P1 expansion.
      status: pending
      evidence:
        - governance/evidence/WP-P0-001/operator-decisions-2026-08-11.md
        - governance/evidence/WP-P0-001/p0-gate-evaluation-package.md

rollback:
  strategy: Revert the interface pull request through a reviewed merge commit if needed. Web rolls
    back by promoting the recorded prior Vercel deployment in each project; Workers roll back to the
    recorded version with wrangler rollback. No migration, data, branch, backup, rollback material
    or other session's work is deleted. For the A4 release, promoting the recorded prior web
    deployment restores its build and environment snapshot without another environment update. For
    A6, use the recorded prior Core version and record whether its CORS setting was restored; any
    forward repair of that exact setting follows the reviewed guarded release. No other provider,
    route, secret or environment value changes.
  remote_actions_required: false
external_effects:
  remote_mutation: approval-required
  destructive_remote_actions: false
handoff:
  current_step: ui-008-release
  next_action: Fix the studio chooser/overview craft findings and finish the current pre-transition
    quality pass, then carry unproven obligations into RENDER-001 under A2.
  blockers: []
  changed_paths: []
  last_green_checks: []
completion:
  successor_packet_id: WP-PLATFORM-RENDER-001
  evidence_paths: []
  completed_at: null

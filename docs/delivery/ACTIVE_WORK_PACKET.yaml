schema_version: 1
id: WP-P3-007
spec_revision: 1
title: Production Supabase migrations and security hardening
phase: P3
status: in_progress
priority: critical
branch: codex/viralgraph-cleanroom
objective: Apply the exact reviewed repository migration sequence to the isolated production
  Supabase project, prove RLS and Auth fail closed, and leave the database unbound from production
  clients until a separate environment-binding packet.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - quality-gates
  - local-env-secrets
  - deploy-rollback-incidents
  - legacy-v1-retirement
  - codex-finish-mega-prompt
required_skills:
  - supabase
  - data-architect
  - auth-fortress
  - quality-check
depends_on:
  - WP-P3-006
scope:
  allowed_paths:
    - supabase/**
    - governance/evidence/WP-P3-007/**
    - governance/evidence/WP-P3-006/**
    - governance/tests/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - tsconfig.json
    - tsconfig.base.json
    - eslint.config.mjs
    - vitest.config.ts
    - PROJECT_STATE.yaml
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
  forbidden_paths:

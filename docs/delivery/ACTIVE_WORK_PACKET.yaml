    title: Add explicit staging and production CANVAS_COORDINATION bindings and regression tests.
    status: pending
  - id: p3c-002-dry-run-and-types
    title: Prove environment-specific Wrangler types and dry-runs have the expected binding and no
      inheritance warning.
    status: pending
  - id: p3c-003-staging-deploy-smoke
    title:
      Deploy only mustbeviral-v2-staging-collaboration, record its version, and run a bounded smoke
      without connecting production traffic.
    status: pending
  - id: p3c-004-release-readiness-handoff
    title: Record remediation evidence and prepare the separately governed V2 release-readiness
      successor without touching legacy V1.
    status: pending
acceptance:
  automated:
    - id: environment-binding-parity
      criterion:
        Tests and Wrangler dry-runs prove CANVAS_COORDINATION is present in default, staging, and
        production configurations without an environment-inheritance warning.
      status: pending
      evidence: []
    - id: postgres-remains-authority
      criterion: Existing checkpoint and Worker tests prove collaboration drafts cannot bypass the
        immutable Postgres revision barrier or mutate money and membership authority.
      status: pending
      evidence: []
  manual:
    - id: staging-deployment-contained
      criterion:
        The exact staging collaboration Worker version is recorded, smoke-tested, and has no
        production route, production client, or legacy dependency.
      status: pending
      evidence: []

schema_version: 1
id: WP-P3-002
spec_revision: 1
title: Optional remaining P3 evidence gates
phase: P3
status: in_progress
priority: medium
branch: codex/viralgraph-cleanroom
objective: Execute the accepted Hyperdrive fixture-seed procedure and G1-G6 matrix only when the
  operator authorizes that measurement window, keep a separate executor and BYOK gated, and never
  start P4 agency work without DTC retention evidence.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - execution-providers-billing
  - data-auth-tenancy
  - adr-0002-platform-boundaries
  - roadmap
  - quality-gates
  - rls-hyperdrive-benchmark-plan
  - codex-finish-mega-prompt
required_skills:
  - cloudflare
  - wrangler
  - workers-best-practices
  - observability-ops
  - data-architect
  - test-mastery
depends_on:
  - WP-P3-001
scope:
  allowed_paths:
    - apps/**
    - packages/**
    - supabase/**
    - governance/evidence/WP-P3-002/**
    - governance/evidence/WP-P3-001/transition-receipt.yaml
    - governance/evidence/WP-P3-001/completed-work-packet.yaml
    - governance/evidence/WP-P3-001/benchmarks/**
    - governance/tests/**
    - governance/schemas/**
    - governance/scripts/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - tsconfig.json
    - tsconfig.base.json
    - eslint.config.mjs
    - vitest.config.ts
    - playwright.config.ts
    - wrangler.jsonc
    - apps/core/wrangler.jsonc
    - PROJECT_STATE.yaml
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
  forbidden_paths:
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - execution-providers-billing
    - data-auth-tenancy
    - adr-0002-platform-boundaries
    - roadmap
    - quality-gates
    - rls-hyperdrive-benchmark-plan
    - codex-finish-mega-prompt
deliverables:
  - A committed fixture-manifest.json and synthetic A/B corpus on mustbeviral-staging only after the
    accepted seed procedure is executed, or a recorded decision to keep G1-G6 deferred.
  - Hyperdrive user-path enablement only if G1 through G6 all pass on that frozen manifest.
  - Separate executor and BYOK only if their evidence gates pass. No P4 agency surfaces.
public_interfaces:
  - Existing REST/MCP/CLI/browser transports remain thin. Optional P3 scale paths stay internal and
    never become a second policy or billing authority.
steps:
  - id: p3b-001-execute-or-keep-deferred
    title: Execute the accepted Hyperdrive fixture-seed procedure on mustbeviral-staging and commit
      fixture-manifest.json, or record that G1-G6 stays deferred for this packet.
    status: completed
  - id: p3b-002-g1-g6-or-close
    title:
      Run the G1-G6 matrix only after the manifest exists, or close without a Hyperdrive binding if
      the operator keeps the Data API/RPC baseline.
    status: completed
  - id: p3b-003-no-agency-handoff
    title: Prove optional-gate outcomes and hand off without starting P4 agency work.
    status: current
acceptance:
  automated:
    - id: postgres-remains-authority
      criterion:
        Tests prove any new Hyperdrive or executor path cannot mutate ledger, membership, or
        canvas head except through existing revision and command barriers.
      status: passed
      evidence:
        - governance/evidence/WP-P3-002/postgres-remains-authority.md
        - packages/db/src/index.test.ts
        - apps/core/test/unit/p3-scale-evidence-harness.test.ts
    - id: no-ungated-enablement
      criterion: No Hyperdrive user-path binding, separate executor, or BYOK ships without a passed
        evidence gate.
      status: passed
      evidence:
        - governance/evidence/WP-P3-002/no-ungated-enablement.yaml
        - governance/evidence/WP-P3-002/hyperdrive-g1-g6-deferred-2026-09-01.md
        - apps/core/wrangler.jsonc
        - governance/tests/staging-hyperdrive-gate.test.mjs
        - governance/tests/p3-optional-gates.test.mjs
  manual:
    - id: no-agency-expansion
      criterion: This packet did not add agency portals, white-labeling, multi-client reporting, or
        connected social publishing.
      status: passed
      evidence:
        - governance/evidence/WP-P3-002/no-agency-expansion.yaml
        - governance/evidence/WP-P3-002/optional-gate-outcomes-2026-09-01.md
        - governance/tests/p3-optional-gates.test.mjs
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-002/optional-gate-outcomes-2026-09-01.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-002/optional-gate-outcomes-2026-09-01.md
  - id: repository-verification
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-P3-002/optional-gate-outcomes-2026-09-01.md
      - governance/evidence/WP-P3-002/no-ungated-enablement.yaml
rollback:
  strategy:
    Keep Data API/RPC baseline. Delete only synthetic A/B fixture rows created by the accepted
    seed procedure. Remove a Hyperdrive binding only with a recorded binding ID. Instant queue
    rollback remains QUEUES_ENABLED=false on mustbeviral-v2-staging-core.
  remote_actions_required: false
external_effects:
  remote_mutation: approval-required
  destructive_remote_actions: false
handoff:
  current_step: p3b-003-no-agency-handoff
  next_action: Verify and commit WP-P3-002, then run pnpm agent:finish --successor
    governance/evidence/WP-P3-002/successor-WP-P3-003.yaml.
  blockers: []
  changed_paths:
    - apps/core/tools/p3-hyperdrive-benchmark-harness.ts
    - apps/core/test/unit/p3-scale-evidence-harness.test.ts
    - governance/tests/staging-hyperdrive-gate.test.mjs
    - governance/tests/p3-optional-gates.test.mjs
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
    - docs/STATUS.md
    - docs/generated/TRACEABILITY.md
    - llms.txt
    - PROJECT_STATE.yaml
    - governance/evidence/WP-P3-002/staging-inspection-2026-09-01.md
    - governance/evidence/WP-P3-002/hyperdrive-g1-g6-deferred-2026-09-01.md
    - governance/evidence/WP-P3-002/no-ungated-enablement.yaml
    - governance/evidence/WP-P3-002/postgres-remains-authority.md
    - governance/evidence/WP-P3-002/no-agency-expansion.yaml
    - governance/evidence/WP-P3-002/optional-gate-outcomes-2026-09-01.md
    - governance/evidence/WP-P3-001/benchmarks/hyperdrive-g1-g6-deferred-wp-p3-002-2026-09-01.md
    - governance/evidence/WP-P3-001/benchmarks/summary/decision-table.md
    - governance/evidence/WP-P3-001/completed-work-packet.yaml
    - governance/evidence/WP-P3-002/operator-authorization-and-remote-inventory-2026-09-02.md
    - governance/evidence/WP-P3-002/successor-WP-P3-003.yaml
  last_green_checks:
    - pnpm design:check
    - pnpm governance:check
    - pnpm verify
completion:
  successor_packet_id: WP-P3-003
  evidence_paths:
    - governance/evidence/WP-P3-002/staging-inspection-2026-09-01.md
    - governance/evidence/WP-P3-002/hyperdrive-g1-g6-deferred-2026-09-01.md
    - governance/evidence/WP-P3-002/no-ungated-enablement.yaml
    - governance/evidence/WP-P3-002/postgres-remains-authority.md
    - governance/evidence/WP-P3-002/no-agency-expansion.yaml
    - governance/evidence/WP-P3-002/optional-gate-outcomes-2026-09-01.md
    - governance/evidence/WP-P3-002/operator-authorization-and-remote-inventory-2026-09-02.md
    - governance/evidence/WP-P3-002/successor-WP-P3-003.yaml
    - governance/tests/p3-optional-gates.test.mjs
  completed_at: null

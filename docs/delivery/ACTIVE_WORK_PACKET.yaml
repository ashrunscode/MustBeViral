rollback:
  strategy:
    Revert the packet's implementation paths and generated/evidence changes through auditable
    Git history while preserving immutable transition receipts. Record every provisioned cloud
    target, exact resource ID, binding, dependency, and teardown procedure in sanitized evidence
    before use; do not perform destructive remote teardown without exact target IDs,
    rollback/recovery evidence, and separate authorization permitted by repository policy. Missing
    teardown authority leaves the isolated resource disabled and documented rather than destroyed.
  remote_actions_required: false
external_effects:
  remote_mutation: authorized
  destructive_remote_actions: false
handoff:
  current_step: p0-007-p0-gate-evaluation
  next_action: Operator records the ready partner under an existing EV-01 through EV-08 candidate ID
    in the approved private recruiting system, including complete qualification, durable staging-use
    and commercial-commitment evidence, and one verified recipient, then reruns staging enablement.
  blockers:
    - Live GB-02 16/16 is retired. Probe 17145ccd still content_policy_violation after the
      closed-packaging master-2 direction on Worker 872ac183. Do not pay GB-02 again. Harness 16/20
      still stands. Evidence governance/evidence/WP-P0-001/fail-evaluation/17145ccd.md.
    - Buyer last mile ZIP/copy/header/upload remains available in current staging. Official
      fal-ai/flux-2-pro input has no image_url; packshot bytes cannot ride the pinned T2I route.
      Live Reject is already not offered. Evidence
      governance/evidence/WP-P0-001/packshot-upload-staging-walk.md.
    - Production-segment Web Vitals are unmeasured, and P0 cannot mark them passed until an accepted
      measurement/sequencing path preserves the evidence standard without promoting V2 or cutting
      legacy traffic outside the P1a production packet. usable-pack-landed-cost remains pending.
      Catalog capture is 4,550,000 micros; that is the customer charge, not a fal invoice. No
      usable-pack denominator. Evidence
      governance/evidence/WP-P0-001/landed-cost-honesty-inventory.md.
    - P0 exit still needs production-segment Web Vitals, 5-8 qualified evaluator sessions, sanitized
      durable proof that one qualified DTC customer/design partner will use staging and either
      intends to pay or has agreed commercial terms, plus an operator go/no-go. Actual payment and
      Stripe are not required in P0; the decision alone does not pass the pending gate.
      Self-sessions do not count. See
      governance/evidence/WP-P0-001/operator-decisions-2026-08-30.md.

schema_version: 1
id: WP-P3-009
spec_revision: 1
title: Owner-only production observation and traffic decision
phase: P3
status: in_progress
priority: critical
branch: codex/viralgraph-cleanroom
objective: With fresh explicit operator authorization, prove exactly one approved owner session on
  the SSO-protected provider surface, observe the disabled private foundation for 72 continuous
  hours, and prepare a separate evidence-backed DNS/customer-traffic go or no-go decision without
  performing cutover.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - quality-gates
  - local-env-secrets
  - deploy-rollback-incidents
  - legacy-v1-retirement
  - codex-finish-mega-prompt
required_skills:
  - auth-fortress
  - observability-ops
  - cloudflare
  - wrangler
  - supabase
  - quality-check
depends_on:
  - WP-P3-008
scope:
  allowed_paths:
    - apps/core/**
    - apps/web/**
    - packages/config/**
    - packages/contracts/**
    - packages/db/**
    - supabase/**
    - governance/evidence/WP-P3-009/**
    - governance/evidence/WP-P3-008/**
    - governance/tests/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - tsconfig.json
    - tsconfig.base.json
    - eslint.config.mjs
    - vitest.config.ts
    - PROJECT_STATE.yaml
    - llms.txt
    - docs/delivery/ACTIVE_WORK_PACKET.yaml
    # Scope amendment under the brand-context task authority, 2026-09-15 (WP-P3-009 lead). No owner
    # decision authorises this amendment; the authority is the lead's task, and it is recorded here
    # as such rather than as an owner decision. These five entries admit the brand/ folder, the
    # repo-local agent skill copies, the agent contract file and the formatter ignore list. The
    # amendment does not change this packet's objective, steps, acceptance criteria, quality gates
    # or evidence requirements.
    - brand/**
    - .agents/skills/**
    - .claude/skills/**
    - AGENTS.md
    - .prettierignore
    # Scope amendment on explicit owner instruction, 2026-09-16: remove the unused SuperDesign CLI
    # dependency and back the shared Dialog primitive with an accessible headless library. The
    # toolchain pin record lives in governance/toolchain.yaml and the shared primitives live in
    # packages/ui, neither of which this packet admitted. The amendment does not change this
    # packet's objective, steps, acceptance criteria, quality gates or evidence requirements.
    - governance/toolchain.yaml
    - packages/ui/**
    # Scope amendment on explicit owner instruction, 2026-09-16: fix collaboration identity. The
    # collaboration worker accepts WebSocket and snapshot requests without authentication and trusts
    # the actor_id each client sends, and the web app gives every live user the same actor_id. The fix
    # binds server-verified identity in apps/collaboration and its shared protocol and client in
    # packages/collaboration, neither of which this packet admitted. The amendment does not change
    # this packet's objective, steps, acceptance criteria, quality gates or evidence requirements.
    - apps/collaboration/**
    - packages/collaboration/**
    # Scope amendment on explicit owner instruction, 2026-09-16: fix Stripe wallet funding (issue
    # 20). One Stripe payment can credit the prepaid usage wallet twice, because both
    # checkout.session.completed and invoice.paid credit it under different event ids. The owner
    # decided that only explicit wallet top-ups fund the wallet. The settlement plan that decides
    # which Stripe events credit the wallet lives in packages/billing, which this packet did not
    # admit. The amendment does not change this packet's objective, steps, acceptance criteria,
    # quality gates or evidence requirements.
    - packages/billing/**
    # Scope amendment on explicit owner instruction, 2026-09-16: correct two stale references left by
    # the SuperDesign removal and the WCAG AA colour fix. README.md still gates production UI on a
    # SuperDesign artifact, and .superdesign/design-system.md still prescribes colours that fail WCAG
    # AA. Only those two files are admitted. The amendment does not change this packet's objective,
    # steps, acceptance criteria, quality gates or evidence requirements.
    - README.md
    - .superdesign/design-system.md
  forbidden_paths:
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - data-auth-tenancy
    - quality-gates
    - local-env-secrets
    - deploy-rollback-incidents
    - legacy-v1-retirement
    - codex-finish-mega-prompt
deliverables:
  - Fresh explicit authorization names exactly one owner identity; provisioning and credentials stay
    out of source and evidence, public signup remains disabled, and no customer is admitted.
  - The approved owner proves sign-in, JWT validation, workspace-scoped RLS/database connectivity,
    private artifact denial/access boundaries, and sign-out without generation, charging, or queues.
  - The protected provider surface is observed for 72 continuous hours with all behavior gates off,
    zero customer/provider/charge rows, private R2, and redacted error/latency evidence.
  - A separate traffic decision packet records owner go or no-go, rollback owner, exact DNS/routes,
    and current evidence; this packet performs no DNS, custom-domain, or public-traffic mutation.
public_interfaces:
  - The SSO-protected Vercel team alias, the workers.dev Core URL, and (owner-authorized deviation,
    governance/evidence/WP-P3-009/production-collaboration-traffic-decision-2026-09-16.md) the
    workers.dev production collaboration URL are in scope. Legacy V1, MustBeViral custom domains,
    public signup, customer admission, provider execution, queues, and charging remain unchanged.
steps:
  - id: p3i-001-owner-identity-decision
    title: Obtain fresh explicit authorization for exactly one production owner identity.
    status: completed
  - id: p3i-002-authenticated-zero-spend-smoke
    title:
      Run the approved owner sign-in, RLS, database, artifact, and sign-out smoke with all spend
      gates off.
    status: completed
  - id: p3i-003-private-72-hour-observation
    title: Observe the protected provider surface and zero-mutation invariants for 72 continuous hours.
    status: current
  - id: p3i-004-traffic-go-no-go-packet
    title: Prepare but do not execute a separate exact DNS/customer-traffic decision packet.
    status: pending
acceptance:
  automated:
    - id: owner-session-containment
      criterion:
        Provider and database evidence proves the one approved owner session was tenant scoped
        and created no provider, queue, charge, signup, or customer activity.
      status: passed
      evidence:
        - governance/evidence/WP-P3-009/owner-identity-authorization-2026-09-04.md
        - governance/evidence/WP-P3-009/owner-session-zero-spend-smoke-2026-09-04.md
    - id: observation-window
      criterion: A continuous 72-hour provider observation shows healthy private endpoints, redacted
        telemetry, private storage, disabled gates, and no customer-impacting activity.
      status: pending
      evidence:
        - governance/evidence/WP-P3-009/private-72-hour-observation-2026-09-07.md
        - governance/evidence/WP-P3-009/replacement-observation-baseline-2026-09-08.md
  manual:
    - id: fresh-traffic-decision
      criterion:
        The owner explicitly records go or no-go after reading the exact smoke, observability,
        rollback, capacity, and legacy evidence; silence is not approval.
      status: pending
      evidence: []
quality_gates:
  - id: design-direction
    command: pnpm design:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-009/gate-run-2026-09-08.md
  - id: governance
    command: pnpm governance:check
    status: passed
    evidence:
      - governance/evidence/WP-P3-009/gate-run-2026-09-08.md
  - id: repository-verification
    command: pnpm verify
    status: passed
    evidence:
      - governance/evidence/WP-P3-009/gate-run-2026-09-08.md
rollback:
  strategy:
    Keep all behavior gates false, leave the protected provider deployment in place, stop the
    observation, revoke only the newly authorized owner session if compromised, and fix forward. Do
    not alter DNS, legacy traffic, migration history, or production data in this packet.
  remote_actions_required: true
external_effects:
  remote_mutation: approval-required
  destructive_remote_actions: false
handoff:
  current_step: p3i-003-private-72-hour-observation
  next_action: 'p3i-003: continue the replacement observation from 2026-09-08T03:18:11Z through at
    least 2026-09-11T03:18:11Z; hour-01 evidence is recorded, the next required daily capture is
    September 9 at 03:18:11Z plus or minus two hours, and the separate owner traffic ruling remains
    pending.'
  blockers: []
  changed_paths:
    - governance/evidence/WP-P3-009/trunk-sync-2026-09-04.md
    - governance/evidence/WP-P3-009/owner-identity-authorization-2026-09-04.md
    - governance/evidence/WP-P3-009/owner-session-zero-spend-smoke-2026-09-04.md
    - governance/evidence/WP-P3-009/private-observation-2026-09-05.md
    - governance/evidence/WP-P3-009/private-observation-2026-09-06.md
    - governance/evidence/WP-P3-009/private-observation-2026-09-08.md
    - governance/evidence/WP-P3-009/private-72-hour-observation-2026-09-07.md
    - governance/evidence/WP-P3-009/replacement-observation-baseline-2026-09-08.md
    - governance/evidence/WP-P3-009/replacement-observation-hour-01-2026-09-08.md
    - governance/evidence/WP-P3-009/observation-recovery-procedure-2026-09-08.md
    - governance/evidence/WP-P3-009/traffic-decision-draft.md
    - governance/evidence/WP-P3-009/execution-recovery-review-2026-09-08.md
    - governance/evidence/WP-P3-009/gate-run-2026-09-08.md
    - governance/evidence/WP-P3-009/successor-WP-P3-010.yaml
  last_green_checks:
    - pnpm agent:preflight
    - pnpm agent:verify
completion:
  successor_packet_id: null
  evidence_paths: []
  completed_at: null

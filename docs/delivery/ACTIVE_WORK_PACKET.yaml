  - Staging dry-run and generated binding checks contain CANVAS_COORDINATION without inheritance
    warnings.
  - Cloudflare account d2897bdebfa128919bd89b265e6a712e contains a verified
    mustbeviral-v2-staging-collaboration deployment with recorded version and containment evidence.
public_interfaces:

schema_version: 1
id: WP-PLATFORM-W1-001
spec_revision: 1
title: Durable studios, access grants and brand identity
phase: P4
status: ready
priority: critical
branch: codex/viralgraph-cleanroom
objective: Deliver the persistent tenant-safe foundation for W1.1-W1.2 so an authorized operator can
  create a studio, attach a permitted workspace, and manage distinct brands and locations through
  shared commands and queries. No new production UI is shipped by this backend packet.
authority_refs:
  - product-contract
  - release-scope
  - system-overview
  - data-auth-tenancy
  - api-mcp-cli
  - execution-providers-billing
  - experience-contract
  - quality-gates
  - roadmap
  - local-env-secrets
  - adr-0007-full-platform
required_skills:
  - build-mustbeviral
  - data-architect
  - auth-fortress
  - api-and-interface-design
  - quality-check
depends_on:
  - WP-PLATFORM-W0-001
scope:
  allowed_paths:
    - apps/core/**
    - apps/cli/**
    - apps/mcp/**
    - packages/contracts/**
    - packages/domain/**
    - packages/db/**
    - packages/config/**
    - supabase/**
    - governance/**
    - docs/**
    - PROJECT_STATE.yaml
    - llms.txt
  forbidden_paths:
    - apps/web/**
    - .github/workflows/**
    - docs/archive/**
    - legacy-exports/**
  required_doc_ids:
    - product-contract
    - release-scope
    - system-overview
    - data-auth-tenancy
    - api-mcp-cli
    - execution-providers-billing
    - experience-contract
    - quality-gates
    - roadmap
    - local-env-secrets
deliverables:
  - Add normalized studios, studio memberships, owner-authorized workspace grants, brands and
    locations with immutable identities, workspace scoping and explicit action grants. A studio is a
    portfolio view; the workspace remains the tenant, ledger and RLS boundary.
  - Specify ownership mapping before additive migration. Backfill only from active authoritative
    workspace ownership, report orphan or conflicting ownership, validate before/after counts and
    retain a reversible mapping. Never infer a grant from creator names, email or portfolio
    visibility.
  - Add create/list/get/update/archive studio and brand/location commands and queries plus
    owner-authorized grant/revoke handlers. All adapters use shared handlers, generated wire
    contracts and Postgres-backed permissions. Validate parent workspace for every identifier.
  - Add cursor pagination and deliberate not-found/forbidden semantics; archived brands remain
    referentially intact. Privileged credentials cannot become browser data or permission evidence.
  - Require W0 database baseline acceptance before activation. The W0 prototype is a design input;
    the UI successor uses the WashBodega/UnPile direction explicitly approved on 2026-09-09 and
    recorded by the experience contract, with behavior and accessibility verified separately.
  - Prepare WP-PLATFORM-W1-002 for persistent onboarding, resource-aware navigation and compatible
    old links, settings/invitation presets and actual ledger-backed billing reads (W1.3-W1.5).
public_interfaces:
  - Authoritative Zod command/query schemas and operation registry additions generate REST OpenAPI,
    typed clients, MCP and CLI projections. Preserve all existing operation names and wire fields.
  - Additive Postgres schema and generated database types; existing workspace, project, canvas,
    execution and ledger contracts remain callable by the previous application version.
steps:
  - id: w1a-001-ownership-and-schema
    title: Specify explicit ownership mapping and add normalized portfolio identity and grants with RLS.
    status: pending
  - id: w1a-002-shared-operations
    title: Implement typed shared commands and queries with transaction, tenant and revocation checks.
    status: pending
  - id: w1a-003-transports-and-backfill
    title: Generate transport/database contracts and prove additive backfill and compatible rollback
      locally.
    status: pending
  - id: w1a-004-isolation-and-successor
    title: Run both-brand isolation journeys and prepare the bounded onboarding/navigation/billing
      successor.
    status: pending
acceptance:
  automated:
    - id: durable-two-brand-identity
      criterion:
        WashBodega and UnPile (owner-selected second brand; synthetic operational data) have
        separate workspace identities, grants, brands and locations; reload/reconnect reads
        authoritative state with no fixture or browser-storage substitute. Studio list responses
        contain only currently permitted records.
      status: pending
      evidence: []
    - id: tenant-and-revocation
      criterion:
        Handler and pgTAP tests deny cross-workspace child IDs, forged studio access, revoked
        memberships/grants, owner transfer conflicts and unauthorized brand mutation; grants never
        confer billing access implicitly. Revoke access while a request is in flight.
      status: pending
      evidence: []
    - id: migration-and-backfill
      criterion:
        All migrations and pgTAP tests pass on local Supabase; duplicate/backfill reruns, orphan
        owners and conflicting mappings fail explicitly. Old application contracts still run against
        the additive schema and tenant ledger counts/balances remain unchanged.
      status: pending
      evidence: []
    - id: transport-parity
      criterion:
        Browser-ready REST clients, MCP and CLI share operation validation and authorization;
        idempotent creation/replay, concurrent slug/name collision, invalid pagination and archived
        references have behavioral tests. Generated contracts and documentation are current.
      status: pending
      evidence: []
  manual: []
quality_gates:
  - id: database
    command: pnpm supabase:test
    status: pending
    evidence: []
  - id: governance
    command: pnpm governance:check
    status: pending
    evidence: []
  - id: repository
    command: pnpm verify
    status: pending
    evidence: []
rollback:
  strategy: Preserve old workspace/ledger tables and all durable IDs. Revert application handlers to
    the prior version while retaining additive tables and ownership mapping. Test that old commands
    continue working. Do not drop tenant data or reverse a backfill by guessing ownership;
    corrective local migrations must use the recorded mapping. No remote migrations are authorized.
  remote_actions_required: false
external_effects:
  remote_mutation: read-only
  destructive_remote_actions: false
handoff:
  current_step: w1a-001-ownership-and-schema
  next_action:
    After W0 is legitimately completed, run preflight and define explicit studio/workspace
    grant and brand/location ownership mapping with additive local migration tests.
  blockers: []
  changed_paths: []
  last_green_checks: []
completion:
  successor_packet_id: WP-PLATFORM-W1-002
  evidence_paths: []
  completed_at: null

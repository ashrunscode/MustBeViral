schema_version: 1
id: WP-P0-001
spec_revision: 3
title: Real Meta Campaign Launch Pack vertical slice and private MCP proof
phase: P0
status: in_progress
priority: critical
branch: codex/viralgraph-cleanroom
objective: Build and validate the real DTC Meta Campaign Launch Pack vertical slice from a
  trustworthy structured brief through constrained planning, editable immutable graph revisions,
  transparent quote and explicit confirmation, real fal and Moonshot provider execution, verified
  private artifacts, review and approval, deterministic export and immutable cost/lineage receipt,
  while proving the exact private five-operation MCP surface has REST-semantic parity and every P0
  technical, usability, quality, economic, and paid-demand gate passes.
